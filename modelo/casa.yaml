    - {id: antepecho_sur_alt, tipo: baranda, alto: 1.80, de: [-1.125, 6.67], a: [16.90, 6.67], nota: "MURO CIEGO hacia el vecino (Lote 103), ~1.80 m sobre el piso de la terraza y la franja: sin vista directa (OM 4100/10 art. 44); ladrillo de 6 huecos sobre el muro medianero"}
    - {id: antepecho_fondo_alt, tipo: baranda, alto: 1.80, de: [16.90, 4.67], a: [16.90, 6.67], nota: "antepecho del fondo de la franja"}
    # Llegada real (foto del usuario 2026-10-05): hay losa entre B2 y la escalera, al sur del eje B. Muro sobre el eje B
    # de B2 hasta el tramo de 10 (idea del usuario) y baranda al costado del tramo de 10.
    - {id: muro_llegada_b, tipo: ladrillo, de: [4.40, 2.68], a: [5.725, 2.68], estado: propuesto, nota: "muro de ladrillo de 6 huecos sobre el eje B, de B2 hasta la escalera, sobre el borde del hueco: CONSULTAR INGENIERO si hay viga B ahí (lo más probable) y si aguanta el tabique"}
    - {id: baranda_hueco_alt, tipo: baranda, alto: 1.10, de: [5.725, 1.325], a: [5.725, 3.85], estado: propuesto, nota: "costado del tramo de 10 que llega al altillo, del descanso (y 1.325) a la llegada (y 3.85): al oeste queda el hueco sobre el tramo de 6. 0.95 en vertical sobre las narices y 1.10 en el tramo horizontal del borde del hueco en la llegada. Fierro negro, barrotes verticales cada ≤ 0.10 (bebé), sin travesaños, pasamanos de madera (ver baranda_escalera_pb, 2026-10-08); puerta de seguridad removible en el último escalón (y≈3.85)"}

# Lo que queda por encima del plano de corte (se dibuja punteado): aleros, tanque sobre el techo.
proyecciones:
  # Cajón gris de las bajantes de la suite y BP1 (2026-10-07, PROPUESTO): no es muro de la casa; se marca en las tres plantas.
  pb:
    - {rect: [-1.425, 6.375, -1.125, 6.495], nombre: "gas", estado: propuesto, nota: "2026-10-08 (PROPUESTO, plan B): COMPARTIMIENTO PROPIO del gas al calefón, pegado al norte del cajón (0.30 × 0.12), separado de las bajantes por una chapa; frente norte de CHAPA PERFORADA (ventila arriba y abajo). El camino queda de 1.08 junto al cajón (antes 1.20)"}
    - {rect: [-1.425, 6.495, -1.125, 6.795], nombre: "cajón BV+BP1", estado: propuesto, nota: "decisión del dueño 2026-10-07: CHAPA PLEGADA de 2 mm pintada del gris de la caja, sobre bastidor de tubo de 30 × 30 anclado SOLO al hormigón macizo (punta de la viga del eje C en volado a +3.40 y +6.60, columna o encadenado), nunca a viguetas, plastoformo ni ladrillo de 6 huecos. APOYA ENTERO en su dado; las grapas solo lo sujetan de costado. Tapas atornilladas de 0.30 × 0.40 en la cara norte a +0.30 y +3.50 (registro de las dos bajantes). Remate arriba con tapa y gotero de 3 cm; la ventilación sale 0.30 más con sombrerete gris oscuro"}
    - {rect: [-1.475, 6.375, -1.075, 6.795], nombre: "dado", estado: propuesto, nota: "2026-10-08: crece 0.12 al norte con el compartimiento del gas. DADO de hormigón de 0.40 × 0.30 al pie del cajón: no pasa de y 6.795 (lindero) y va separado con JUNTA del cimiento del muro sur; antes, pozo de prueba junto al lindero para ver ese cimiento"}
  p1:
    - {rect: [-1.425, 6.375, -1.125, 6.495], nombre: "gas", estado: propuesto}
    - {rect: [-1.425, 6.495, -1.125, 6.795], nombre: "cajón BV+BP1", estado: propuesto}
    # 2026-10-05 (PROPUESTO): borde norte del domo 0.10 al sur (antes y 5.30) para dejar 0.65 de paso entre el muro del
    # departamento (cara y 4.745) y el domo. El borde sur NO se mueve (y 6.20): correr todo 0.10 dejaba solo ~0.35
    # libres hacia el antepecho sur y la ranura a 0.47 del eje C (el revisor pidió ≥0.40 y ≥0.5).
    - {rect: [9.75, 5.40, 10.90, 6.20], nombre: "tragaluz", estado: propuesto, nota: "PROPUESTO: tragaluz cenital del Baño 2, dos ranuras de ~0.30 × 0.60 (y 5.50–6.10; antes 0.70 desde y 5.40) en la losa del altillo, centradas entre viguetas a cada lado de la de x≈10.31 (las viguetas no se cortan), a 0.57 del eje C; bajo un domo (x 9.75–10.90, y 5.40–6.20) en la franja descubierta: 0.65 de paso al norte y ~0.45 libres al antepecho sur"}
  altillo:
    - {rect: [-1.425, 6.375, -1.125, 6.495], nombre: "gas", estado: propuesto}
    - {rect: [-1.425, 6.495, -1.125, 6.795], nombre: "cajón BV+BP1", estado: propuesto}
    - {rect: [6.30, 0.00, 7.90, 1.60], nombre: "tanque elevado (sobre el techo)", nota: "base propia de hormigón sobre la columna A3 y el muro de la escalera; forrado de ladrillo: se ve como un volumen cuadrado; bajada al núcleo técnico (x 9.10)"}

# ─────────────────────────────────────────────────────────────────────────────
# PLANTA DE TECHOS (2026-10-04; ESQUEMA para conversar con el ingeniero y el techador). Todo de calamina.
# - Departamento: techo OCULTO detrás de un antepecho en los cuatro lados (caja recta), a un agua al sur.
# - Terraza: techo aparte de calamina sobre estructura de fierro a la vista (postes y vigas), más bajo que el
#   antepecho del departamento, con caída hacia el FRENTE y canaleta vista en el borde (pedido del usuario).
# - Nada vuela sobre la franja de 2 m del sur (OM 4100/10: separación lateral SIN VOLADO en el 2do piso). Sobre la
#   lavandería, semisombra liviana y desmontable.
# Cotas aproximadas: las define el ingeniero.
# ─────────────────────────────────────────────────────────────────────────────
techos:
  material: "calamina galvanizada prepintada (ondulada o trapezoidal); en el departamento con aislación (lana de vidrio + cielo raso)"
  aguas:
    - id: techo_depto
      nombre: Departamento
      poly: [[4.40, 0.00], [16.90, 0.00], [16.90, 4.67], [4.40, 4.67]]
      cae_hacia: sur
      pendiente: 0.15
      cota_alta: 10.05
      cota_baja: 9.35
      estado: definido
      nota: "oculto detrás del antepecho en los cuatro lados; canaleta interior junto al antepecho sur, toda hacia el este (BP2), con rebosaderos (gárgolas) a la franja cada ~4 m por si se tapa"
    - id: techo_terraza
      nombre: Terraza
      poly: [[-1.125, 0.00], [4.40, 0.00], [4.40, 4.67], [-1.125, 4.67]]
      cae_hacia: oeste
      pendiente: 0.15
      cota_alta: 9.90
      cota_baja: 9.07
      estado: definido
      nota: "calamina sobre estructura de fierro a la vista (pedido del usuario), cae hacia el FRENTE: de la calle se ve un borde horizontal con su canaleta. Alto contra el muro del departamento (+9.90, debajo del antepecho +10.20, con babeta), ~2.45 libres en el borde del frente. Apoyos: postes metálicos sobre A1 y B1 y vigas hacia el muro del departamento (x=4.40); la esquina sur (y=4.67) en voladizo desde B1 o con un poste extra. Babeta contra el muro del departamento. Lo define el ingeniero"
  antepechos:
  # cota_base / cota_tope: de dónde a dónde se DIBUJA cada antepecho en las fachadas. En obra (2026-10-16): los muros de
  # afuera del departamento suben DE UNA VEZ de +6.60 a +10.20 (el antepecho es el mismo muro); la calamina se apoya por
  # dentro (+10.05 al norte, +9.35 al sur) y del lado sur termina contra la cara interior del muro, con la canaleta.
    - {de: [4.40, 0.00], a: [16.90, 0.00], cota_base: 9.60, cota_tope: 10.20, nota: "antepecho norte del departamento: tapa el borde alto"}
    - {de: [16.90, 0.00], a: [16.90, 4.67], cota_base: 9.60, cota_tope: 10.20, nota: "antepecho del fondo"}
    - {de: [4.40, 4.67], a: [16.90, 4.67], cota_base: 9.60, cota_tope: 10.20, nota: "antepecho sur del departamento: la canaleta va por dentro (nada sale a la franja de 2 m)"}
    - {de: [4.40, 0.00], a: [4.40, 4.67], cota_base: 9.60, cota_tope: 10.20, nota: "antepecho oeste del departamento: el techo de la terraza se apoya debajo"}
    - {de: [-1.125, 6.67], a: [16.90, 6.67], cota_base: 6.60, cota_tope: 8.40, nota: "muro ciego sur hacia el vecino, ~1.80 sobre la losa (ver muros.altillo)"}
  # Tanque elevado: base propia de hormigón sobre la columna A3 y el muro de la escalera, forrado de ladrillo.
  # Capacidad y altura SUPUESTAS (tanque de ~2500 L, ~1.55 de diámetro × 1.55 de alto): las define el plomero/ingeniero.
  # Base subida a +10.50 (usuario 2026-10-05): ~2.5 m sobre la entrada de agua del calefón del altillo (~+8.00).
  # Paneles solares a futuro (usuario 2026-10-05): sobre el techo del departamento, en una estructura liviana INCLINADA AL
  # NORTE (~15–20°; el techo cae al sur, que es la orientación mala), detrás del antepecho; sin sombra del tanque.
  solar: {rect: [8.10, 0.30, 16.60, 4.40], estado: propuesto, nota: "espacio reservado (~35 m²) para paneles fotovoltaicos y/o colector de agua caliente; dejar ahora: 2 tubos vacíos de 1\" desde el techo (junto al tanque) hasta el TD por el montante de B2, y una espera de caños AF/AC de PPR tapados en el techo por si se pone un colector solar que precaliente el agua del calefón"}
  tanque: {rect: [6.30, 0.00, 7.90, 1.60], cota_base: 10.50, alto: 1.80, capacidad: "~2500 L (supuesto)", estado: aproximado, nota: "con tapa hermética; REBALSE y DESAGÜE DE LIMPIEZA con llave, a la canaleta/bajante pluvial del techo (no al sanitario); FLOTANTE eléctrico que prende y apaga la bomba de la cisterna (C20); salida con llave de paso y filtro"}
  postes:
    - {pos: [0.00, 0.00], nota: "sobre la columna A1"}
    - {pos: [0.00, 2.68], nota: "sobre la columna B1"}
    - {pos: [-1.03, 4.60], tope: 9.05, estado: propuesto, nota: "2026-10-07 (PROPUESTO): BAJADA DE LA CANALETA del techo de la terraza: tubo cuadrado de fierro de 0.10 × 0.10, NEGRO como los postes, en la esquina sur del techo, por dentro del antepecho del frente; de la punta de la canaleta (+9.07) al piso de la terraza. Al pie descarga en la canaleta de piso con rejilla que va junto al frente hasta el sumidero del rincón. Nada de caño horizontal a la vista"}
  # Canaletas por dentro de la línea y=4.67 (no invaden la separación de 2 m), de chapa galvanizada, 0.5%.
  canaletas:
    - {de: [4.55, 4.58], a: [16.78, 4.58], pendiente: 0.005}
    - {de: [-1.18, 0.10], a: [-1.18, 4.58], pendiente: 0.005, nota: "canaleta vista al frente, colgada del borde del techo de la terraza (queda a ~1.05 de la fachada: dentro del voladizo frontal de 1.20)"}
  # Semisombra (malla raschel o toldo) sobre la lavandería: liviana y desmontable, a la altura del antepecho sur.
  semisombras:
    - {rect: [7.05, 4.67, 9.70, 6.67], nombre: "semisombra lavandería", nota: "malla semisombra o toldo retráctil sobre perfiles livianos, entre el muro del departamento y el muro ciego sur; desmontable (no es techo ni volado: confirmar con el arquitecto). El tendedero queda al sol"}
  # La terraza y la franja forman una franja continua de losa descubierta (y 4.67–6.67): punto alto al medio,
  # caída 1.5% hacia las dos esquinas sur, donde están los sumideros y las bajantes pluviales.
  pendientes_losa:
    - {de: [7.90, 6.05], a: [0.20, 6.05], texto: "losa 1.5%"}
    - {de: [7.90, 6.05], a: [15.60, 6.05], texto: "losa 1.5%"}
    - {de: [-0.30, 2.10], a: [-1.00, 2.10], texto: "logia 1% al frente"}
  sumideros:
    # 2026-10-07 (PROPUESTO, revisión del arquitecto punto 4): sumidero de la terraza en el rincón suroeste, contra los dos
    # antepechos, de SALIDA LATERAL: sale por la base del antepecho del frente al cajón gris (no se perfora la losa). Antes (-0.75, 6.40).
    - {pos: [-0.90, 6.45], estado: propuesto}
    - {pos: [16.55, 6.40]}
  # Cada canaleta baja por un tubo pegado al antepecho hasta la bajante de la esquina (no se vuelca sobre la losa).
  conexiones:
    # Canaleta del frente (2026-10-07, PROPUESTO): baja por el tubo cuadrado negro de la esquina sur del techo (ver postes); al pie,
    # CANALETA DE PISO con rejilla junto al antepecho del frente hasta el sumidero del rincón; de ahí, salida lateral al cajón (BP1).
    - [[-1.18, 4.58], [-1.03, 4.60]]
    - [[-1.03, 4.60], [-1.00, 4.60], [-1.00, 6.45], [-0.90, 6.45]]
    - [[-0.90, 6.45], [-0.90, 6.56], [-1.36, 6.56], [-1.36, 6.645]]   # 2026-10-08: entra al cajón por y 6.56 (al norte está el compartimiento del gas)
    - [[16.78, 4.58], [16.78, 6.55]]
  bajantes:
    - {id: BP1, pos: [-1.36, 6.645], tope: 8.40, estado: propuesto, nota: "2026-10-07 (PROPUESTO, revisión del arquitecto punto 4, aceptado por el dueño; antes en (-1.00, 6.55), atravesaba la ducha de la suite y el volado): POR FUERA, en el CAJÓN GRIS de la esquina suroeste de la caja del baño de la suite (cajón x -1.425 a -1.125, y 6.495 a 6.795, del suelo a +8.40, pegado al canto del volado), del lado de la calle; al lado, del lado de la casa, la bajante sanitaria de la suite. Recibe la canaleta del techo de la terraza (por el tubo negro y la canaleta de piso), el sumidero de la terraza (salida lateral por la base del antepecho) y la logia del primer piso (canaleta-cornisa gris por todo el frente). NO se perfora el volado. Abajo: tapón de registro al pie y caño Ø100 enterrado al POZO DE ABSORCIÓN del jardín (ver instalaciones.pb.sanitario.pluvial), nunca al desagüe sanitario. Ø100 (techo ~26 m² + terraza ~11 m² + logia): lo confirma el plomero"}
    - {id: BP2, pos: [16.78, 6.55], nota: "esquina sur del fondo (C5): techo del departamento + sumidero de la franja; baja al patio → jardín o calle (no al desagüe sanitario)"}

# Fachada (2026-10-05): opciones de materiales para conversar con el usuario. Referencias en
# fuentes/referencias-fachada/. `paleta` = color por tipo de pieza; `acentos` = paños de material sobre una cara:
# vista, u (horizontal de esa vista: oeste = y), z (alto), d (profundidad de la cara: oeste = x de la cara exterior).
fachada:
  elegida: c     # el usuario eligió la opción C (2026-10-05)
  opciones:
    - id: a
      nombre: Blanco y negro
      descripcion: "Como la primera referencia: casa blanca con piezas negras. Carpintería, barandas, puerta y techo de la terraza en negro; el frente del baño de la suite como un volumen negro y un paño negro alrededor de la puerta de entrada. Sobria y contrastada; el negro al oeste se calienta con el sol de la tarde."
      paleta: {muro: "#f5f5f3", losa: "#f5f5f3", zocalo: "#2b2b2b", baranda: "#1e1e1e", marco: "#1e1e1e", puerta: "#1f1f1f", techo: "#1e1e1e", celosia: "#2b2b2b", antepecho: "#f5f5f3", tanque: "#f5f5f3", columna: "#f5f5f3"}
      acentos:
        - {vista: oeste, u: [4.20, 6.795], z: [3.40, 6.40], d: -1.125, material: negro, nota: "frente del baño de la suite"}
        - {vista: oeste, u: [4.95, 6.795], z: [0.20, 3.20], d: -0.125, material: negro, nota: "paño de la entrada"}
    - id: b
      nombre: Beige, marco gris y madera
      descripcion: "Como la segunda referencia: muros beige, bordes de losa en gris oscuro que enmarcan la logia como una caja, listones de madera en la pared del dormitorio dentro de la logia (protegida por el volado), puerta pivotante y celosía de madera, barandas livianas. Cálida y moderna."
      paleta: {muro: "#ddd0bb", losa: "#43464a", zocalo: "#8f8a82", baranda: "#5a5a5a", marco: "#2b2b2b", puerta: "#a8703f", techo: "#43464a", celosia: "#a8703f", antepecho: "#ddd0bb", tanque: "#ddd0bb", columna: "#ddd0bb"}
      acentos:
        - {vista: oeste, u: [4.20, 6.795], z: [3.20, 6.60], d: -1.125, material: gris_oscuro, nota: "costado del marco de la logia: frente del baño de la suite"}
        - {vista: oeste, u: [-0.125, 3.25], z: [3.40, 6.40], d: -0.125, material: madera, nota: "listones de madera en la pared del dormitorio, dentro de la logia"}
        - {vista: oeste, u: [4.95, 6.795], z: [0.20, 3.20], d: -0.125, material: gris_claro, nota: "paño de la entrada"}
    - id: c
      nombre: Blanco, piedra, madera y gris (recomendada)
      descripcion: "Mezcla de las dos: base blanca; el muro ciego del living (el que da a la calle) en piedra, que aguanta el sol de la tarde sin mantenimiento; madera solo donde está protegida (pared del dormitorio dentro de la logia, puerta y celosía); bordes de losa y frente del baño en gris oscuro como marco; carpintería, barandas y techo de la terraza en negro."
      paleta: {muro: "#f3f1ec", losa: "#43464a", zocalo: "#43464a", baranda: "#2b2b2b", marco: "#2b2b2b", puerta: "#a8703f", techo: "#2b2b2b", celosia: "#a8703f", antepecho: "#f3f1ec", tanque: "#f3f1ec", columna: "#f3f1ec"}
      acentos:
        - {vista: oeste, u: [-0.125, 5.05], z: [0.20, 3.20], d: -0.125, material: piedra, nota: "muro del living hacia la calle. 2026-10-08 (revisión del arquitecto, punto 22): la piedra llega HASTA EL MARCO del vidrio de la entrada (antes terminaba en 4.95 y dejaba una tira blanca de 0.10) y forra los costados de la ranura del living"}
        - {vista: norte, u: [-0.175, 0.125], z: [0.20, 3.20], d: -0.13, material: piedra, nota: "2026-10-08 (punto 22): la piedra DA LA VUELTA 0.30 en la esquina noroeste (x -0.125 a 0.175), para que se lea como un muro macizo y no como una placa pegada; termina con canto limpio, lejos de la ventana del living (x 0.70)"}
        - {vista: oeste, u: [4.20, 6.795], z: [3.20, 6.60], d: -1.125, material: gris_oscuro, nota: "frente del baño de la suite (marco de la logia); 2026-10-07: cara al ras del canto del volado"}
        - {vista: oeste, u: [-0.125, 4.20], z: [3.40, 6.40], d: -0.125, material: madera, nota: "listones en la pared del dormitorio, dentro de la logia. 2026-10-08 (punto 22): llegan HASTA LA CAJA GRIS (antes terminaban en 3.25 y quedaba muro blanco alrededor de la puerta de la logia); la puerta queda dentro del paño de madera"}
        # ── Plan B (2026-10-08, PROPUESTO): retiro norte de 2.00 justo → NADA sobresale de la fachada norte; los caños van adentro ──
        - {vista: norte, u: [-7.525, -7.375], z: [2.95, 3.10], d: -0.13, material: rejilla_blanca, estado: propuesto, nota: "rejilla AL RAS del extractor del lavado, del color del muro (ducto corrido a x 7.45 por el ducto de A3)"}
        - {vista: norte, u: [-10.225, -10.075], z: [6.12, 6.30], d: -0.13, material: rejilla_blanca, estado: propuesto, nota: "rejilla AL RAS del extractor del Baño 2, en el eje de las ventanas de los baños (x 10.15), sobre el dintel"}
        - {vista: norte, u: [-9.30, -9.10], z: [8.50, 8.70], d: -0.13, material: rejilla_blanca, estado: propuesto, nota: "rejilla de la campana del altillo, del color del muro; centrada entre las ventanas de la cocina y del baño (antes 8.75–8.95, apretada contra los caños que se fueron a A3)"}
        - {vista: este, u: [-6.47, -6.43], z: [0.00, 0.62], d: -17.07, material: gas, estado: propuesto, nota: "gas a la cocina: sale del suelo en la esquina C5 y entra a ~0.60 detrás del mesón (opción 2: gas enterrado)"}
        # Cajón de bajantes de la esquina suroeste (2026-10-07, PROPUESTO, revisión del arquitecto punto 4): "la pata" de la caja gris.
        # Cajón x -1.425 a -1.125 (pegado al canto del volado en los tres niveles, sin ranura), y 6.495 a 6.795 (pegado al muro sur),
        # del suelo a +8.40 (remate del muro ciego sur del altillo). CHAPA PLEGADA de 2 mm pintada del gris de la caja (decisión del dueño).
        - {vista: oeste, u: [6.495, 6.795], z: [0.00, 8.40], d: -1.425, material: gris_oscuro, estado: propuesto, nota: "cajón de chapa de las bajantes de la suite (sanitaria) y BP1 (pluvial), frente de 0.30"}
        - {vista: oeste, u: [6.59, 6.70], z: [8.40, 8.70], d: -1.21, material: gris_oscuro, estado: propuesto, nota: "ventilación de la bajante de la suite: sale 0.30 sobre la tapa del cajón, con sombrerete gris oscuro"}
