    sanitario:
      # Agua fría baja del tanque elevado por el núcleo técnico (muro norte). El agua caliente BAJA del calefón del
      # altillo por fuera del muro norte junto a A2 (x 4.20) y entra bajo el piso: suite cerca; baños de los hijos por
      # el hall y el pasillo. Sin termotanque (2026-10-05). Caños de agua caliente aislados con coquilla.
      llaves:
        - {pos: [7.225, 0.56], etiqueta: "LL general P1", estado: propuesto, nota: "2026-10-08 (plan B): frente a la cara sur del ducto de A3, en el hueco de 0.20 entre el ducto y el estante oeste de los blancos (junto a la tapa de registro)"}
        - {pos: [9.55, 2.55], etiqueta: "LL Baño 1"}
        - {pos: [9.55, 4.05], etiqueta: "LL Baño 2"}
        - {pos: [3.20, 5.75], etiqueta: "LL suite"}
      sumideros:
        # 2026-10-07 (PROPUESTO, decisión del dueño): la logia no puede bajar por el volado ni cruzar el baño (no hay altura bajo su
        # piso). Sin sumidero: el piso cae 1 % hacia el FRENTE y vuelca por la base de la baranda en la canaleta-cornisa (ver pluvial).
      # Pluvial (no se mezcla con el desagüe de la suite)
      pluvial:
        - linea: [[-1.175, 0.00], [-1.175, 6.375], [-1.175, 6.55]]
          etiqueta: "cornisa-canaleta → BP1"
          etiqueta_pos: [-1.45, 5.45]
          estado: propuesto
          nota: "decisión del dueño 2026-10-07: canaleta de chapa galvanizada pintada del gris de la caja por TODO el frente del volado del primer piso, de y 0.00 (tapa recta en el arranque) a la pata (cajón, y 6.495). Por fuera es HORIZONTAL, como una cornisa del alto de la banda de la losa (0.20), con el borde de abajo alineado con la cara de abajo de la losa y gotero de 1.5 cm; la pendiente (1 %, ~6.5 cm) va por DENTRO. La logia (piso 1 % hacia el frente) vuelca por la base de la baranda en todo su largo. Se cuelga del canto SOLO donde hay hormigón macizo; si entre B y C no hay viga de borde vaciada, con ménsulas al muro del frente o a la carpeta (lo define el ingeniero)"
      bajada_tanque: {pos: [7.25, 0.20], etiqueta: "AF ↓ tanque (ducto de A3)"}
      subida_caliente: {pos: [4.60, 0.10], etiqueta: "AC ↓ por el ducto de A2 (escalera)"}
      agua_fria: [[[7.25, 0.20], [7.25, 0.60], [9.30, 0.60], [9.30, 3.20], [11.35, 3.20]], [[9.30, 3.20], [6.50, 3.20], [6.50, 4.10], [5.70, 4.10], [5.70, 5.90], [-0.20, 5.90]]]
      agua_caliente: [[[4.60, 0.10], [4.20, 0.10], [4.20, 4.35], [5.95, 4.35], [5.95, 5.65], [-0.20, 5.65]], [[5.95, 4.35], [6.75, 4.35], [6.75, 3.45], [11.35, 3.45]]]
      # Sin colector en este piso: cada artefacto va a su bajante (BV).
      bajantes:
        - {pos: [10.93, 0.27], ambientes: [bano_hijo_1], recorrido_pb: [[10.93, 0.27], [10.93, -0.85]], estado: propuesto, etiqueta: "BAJANTE COMÚN (Baño 1 + baño y cocina del altillo): ADENTRO, en el ducto del rincón de A4 (plan B 2026-10-08)"}
        - {pos: [9.30, 3.85], ambientes: [bano_hijo_2], etiqueta: "Baño 2 → ducto en esquina (almacén abajo)"}
        # 2026-10-07 (PROPUESTO, revisión del arquitecto punto 4): antes en (-0.30, 6.50), dentro del plato de la ducha, perforaba el
        # volado y bajaba a 7.5 cm del marco de la puerta de entrada. Ahora por FUERA, en el cajón gris de la esquina suroeste de la
        # caja (x -1.425 a -1.125, y 6.495 a 6.795, del suelo a +8.40), del lado de la casa; BP1 al lado, del lado de la calle.
        # `entrada` = por dónde entran los caños (esquina suroeste de la ducha, por dentro del muro técnico); `recorrido_pb` = el caño en PB.
        - pos: [-1.21, 6.645]
          entrada: [-0.875, 6.60]
          ambientes: [wc_ppal, ducha_ppal, lavamanos_ppal]
          etiqueta: "suite → cajón gris de la esquina suroeste, por fuera (sin perforar el volado)"
          recorrido_pb: [[-1.21, 6.645], [-1.21, 5.85], [-4.00, 5.85], [-4.00, -0.85]]
          estado: propuesto
          nota: "Ø110. Entran por el muro del frente, en la esquina suroeste de la ducha, POR ENCIMA DE LA LOSA: inodoro COLGADO con estanque empotrado en el muro técnico (~1.8 m, 2 %), ducha con sifón de perfil bajo (~0.6 m) y lavamanos Ø50 por el mueble, el zócalo y bajo el plato (~4.1 m, 2 %). Ventila por arriba: sigue dentro del cajón hasta +8.40 y sale 0.30 más con sombrerete gris oscuro (≥2 m sobre el piso de la terraza). Tapón de registro al pie. En PB: al norte bajo el acceso hasta la cámara CI1 (-1.29, 5.85, en el eje de la puerta), al oeste por y 5.85 (lejos de la cisterna: no se va por el camino hacia la calle), al norte por x -4.00 (borde del pasto, 0.70 del gas de la vereda) y a la cámara CI2 (-4.00, -0.85) en el colector. ~9.4 m de CI1 a CI2 con 2 % (~0.19 de desnivel)"
    ventilacion:
      ductos:
        - id: baño 2
          linea: [[11.00, 6.10], [11.00, 0.70], [10.15, 0.70], [10.15, -0.20]]
          diametro: 100
          extractor: true
          estado: definido
          nota: "extractor del Baño 2 de los hijos → retiro norte por cielo falso del pasillo y del Baño 1; 2026-10-08 (plan B): sale por una rejilla al ras en x 10.15, sobre la ventana del Baño 1 (antes en la pilastra de A4)"
        - id: lavamanos
          linea: [[1.40, 5.30], [-1.30, 5.30]]
          diametro: 100
          extractor: true
          estado: definido
          nota: "extractor de los lavamanos de la suite → frente, por el cielo falso del inodoro"
