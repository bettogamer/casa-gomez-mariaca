# Modelo de la casa — fuente de verdad del proyecto.
#
# Todo lo que se dibuja (plantas SVG, visor 3D, DXF, reporte) se genera desde
# este archivo con `make build`. Para modificar la casa se edita AQUÍ, nunca
# los archivos de `salida/`.
#
# Sistema de coordenadas (metros):
#   x = a lo largo de la casa, 0 en el eje 1 (lado terraza / calle), crece hacia el fondo.
#   y = a lo ancho, 0 en el eje A (lado Lote 105), crece hacia el Lote 103.
#   Ambos ejes se miden a CENTRO de columna. La pared exterior queda ~0.125 m afuera.
#
# Leyenda de `estado` en cada elemento:
#   construido   -> ya existe en obra. NO se modifica sin verificarlo con cinta métrica.
#   aproximado   -> digitalizado de foto; medidas a ±10-20 cm. Confirmar.
#   propuesto    -> modificación nuestra, todavía no aprobada.
#   pendiente    -> falta información.

proyecto:
  nombre: Vivienda unifamiliar
  ubicacion: Cochabamba — Subalcaldía Alejo Calatayud, Distrito 5, Zona Lacma, Mz 101, Lote 4
  codigo_catastral: 05-17-101-063-0-00-000-000
  calle: Pasaje innominado / Calle Víctor Rodrigo (9.00 m)
  fuente_base: >
    Fotos del juego impreso (planos-arqui/IMG_8276..8278, ago-2026). NO coincide
    con el PDF "PLANO DE const. 06-03.pdf" (versión anterior, feb-2020). Ver
    docs/versiones-del-plano.md.

lote:
  largo: 37.25          # P1-P2 (colinda Lote 105, Jesús Maldonado)
  ancho: 9.02           # P1-P4 (frente a la calle)
  # Posición del lote en coordenadas de la casa (esquina P1 = arriba-izquierda).
  origen_x: -15.225     # = fondo(22.025) - 37.25
  origen_y: -2.135      # retiro lateral 2.01 m + media pared
  retiro_fondo: 5.00    # de la pared del fondo al lindero P2-P3
  # Orientación deducida del usuario: el frente recibe sol pleno a las 17:00 -> frente al OESTE.
  # Con el plano sin espejar: eje A / retiro lateral (Lote 105) = NORTE (lado soleado),
  # eje C / vecino (Lote 103) = SUR, patio del fondo = ESTE (sol de mañana).
  orientacion: {frente: oeste, lado_A: norte, lado_C: sur, fondo: este, norte_en_planta: [0, -1]}
  estacionamiento: "2 autos en el jardín delantero (dicho por el usuario)"
  # Normativa: Reglamento Complementario a la Normativa Urbana, OM 4100/10 (reglamento/, resumen en docs/normativa.md).
  # Zona de Renovación de la Imagen Urbana, edificación aislada; frente 9.02 (8.01–10.00) y vía 9.00 (9.00–12.50):
  # 3 plantas = PB y 1er piso con un retiro lateral de 2.00 (incluido voladizo) y apoyo en el otro; 2do piso
  # (altillo) con 2.00 m en AMBOS laterales, sin volado; retiro de fondo ≥ 3.00; voladizo frontal ≤ 1.20.
  # El 2.00 del sur se toma desde la cara del muro medianero (y=6.795): muro del altillo en y=4.67 (cara 4.795).
  retiro_altillo_sur: 2.00
  normativa: {ordenanza: "OM 4100/10", zona: "Renovación de la Imagen Urbana — edificación aislada", plantas_max: 3, retiro_lateral: 2.00, retiro_fondo_min: 3.00, voladizo_frontal_max: 1.20}
  colindantes:
    arriba: Lote 105 — Jesús Maldonado
    abajo: Lote 103 — Germán Sánchez
    fondo: Lote 95 — Rubén Pérez
    frente: Calle Víctor Rodrigo

# Alturas: el usuario cambió en obra a 3.00 m LIBRES (piso a techo), no 3.00 piso a piso
# como decía el plano. Piso a piso = 3.00 + espesor de losa (0.20 supuesto) = 3.20.
# Las cotas cambian si se mide otro espesor de losa.
niveles:
  - id: pb
    nombre: Planta baja
    cota: 0.20          # nivel de piso terminado (según plano)
    altura_libre: 3.00  # piso a techo — confirmado por el usuario
    altura: 3.20        # piso a piso = libre + losa
  - id: p1
    nombre: Primer piso
    cota: 3.40
    altura_libre: 3.00
    altura: 3.20
  - id: altillo
    nombre: Altillo
    cota: 6.60
    altura_libre: 3.00  # altillo aún sin techo construido; altura por definir
    altura: 3.20
    # Techo: ver la sección `techos` (planta de techos, 2026-10-04). Calamina a un agua hacia el sur, oculta tras el
    # antepecho; la terraza con su propio techo de calamina sobre fierro.
    techo: {tipo: calamina, oculto: true, pendiente_hacia: sur, estado: definido}

estructura:
  estado: construido
  nota: Columnas, losas y escalera YA construidas. Son la restricción principal del diseño.
  seccion_columna: 0.25 # 25x25 estimado por el usuario (sin medición)
  espesor_losa: 0.20    # supuesto; medir en obra
  # Losas construidas (2026-10-03): piso del primer piso (+3.40) y piso del altillo (+6.60),
  # recién terminada. El altillo NO tiene techo todavía; columnas llegan hasta +6.60.
  losas_construidas: [p1, altillo]
  # Tipo de losa: alivianada con viguetas pretensadas T.S.D. (reforzadas, 5 alambres dobles) + plastoformo.
  # Fuente: planos-arqui/PLANO ViGETAS.pdf (pedido del proveedor). El usuario confirmó (2026-10-04) que las DOS losas
  # (+3.40 y +6.60) se armaron igual. Lectura en docs/viguetas.md. dir: y = viguetas de norte a sur (de eje A a C),
  # x = de oeste a este. n y largo = lo pedido; la ubicación exacta de cada vigueta no está en el plano.
  viguetas:
    tipo: "alivianada: viguetas pretensadas + plastoformo (espesor total sin medir)"
    igual_en: [p1, altillo]
    panos:
      - {rect: [11.20, 0.00, 16.90, 2.68], dir: y, n: 11, largo: 2.85}
      - {rect: [11.20, 2.68, 16.90, 6.67], dir: y, n: 11, largo: 4.05}
      - {rect: [7.05, 0.00, 11.20, 2.68], dir: x, n: 5, largo: 4.20}
      - {rect: [7.05, 2.68, 11.20, 6.67], dir: y, n: 7, largo: 4.05}
      - {rect: [4.40, 2.68, 7.05, 6.67], dir: y, n: 4, largo: 4.05}
      - {rect: [0.00, 0.00, 4.40, 2.68], dir: y, n: 8, largo: 2.85}
      - {rect: [0.00, 2.68, 4.40, 6.67], dir: y, n: 7, largo: 4.05, nota: "más una franja marcada en amarillo junto al eje 2 (¿maciza?)"}
      - {rect: [-1.125, 0.00, 0.00, 2.68], dir: y, n: 2, largo: 2.85, nota: "volado"}
      - {rect: [-1.125, 2.68, 0.00, 6.67], dir: y, n: 2, largo: 4.05, nota: "volado"}
    hueco: {rect: [4.40, 0.00, 7.05, 2.68], nota: "escalera (paño 2–3 A–B, cruz en el plano)"}
    # En la losa del altillo el hueco sigue más allá del eje B sobre el tramo de 10 de la escalera P1→altillo
    # (confirmado por el usuario 2026-10-05 con foto: junto a B2 el hueco termina en el eje B y hay losa entre B2 y
    # la escalera; los últimos escalones pasan el eje B). Medidas leídas del modelo de la escalera: medir en obra.
    huecos_extra:
      - {nivel: altillo, rect: [5.725, 2.68, 7.05, 3.85], estado: aproximado, nota: "sobre el tramo de 10 (escalones 13–16); ahí las viguetas del paño B–C son más cortas o arrancan en un brocal"}
  # Ejes según planos-arqui/IMG_8278.png: plano con el que se construyeron las columnas
  # (confirmado por el usuario 2026-10-03). IMG_8278 copy.png = misma foto + línea roja B4-B5
  # que solo indica la distancia de ese tramo (no es viga ni muro).
  ejes_x: {"1": 0.00, "2": 4.40, "3": 7.05, "4": 11.20, "5": 16.90}
  ejes_y: {A: 0.00, B: 2.68, C: 6.67}
  # Columnas = intersecciones de ejes, salvo las listadas en `desplazadas`.
  columnas_en: [A1, A2, A3, A4, A5, B1, B2, B3, B4, B5, C1, C2, C3, C4, C5]
  # La cota 4.10 entre 1' y 2' en IMG_8278 es error de dibujo: C1-C2 = 4.40 (comprobado con la
  # planta 1º piso IMG_8277, dormitorio de 4.35 entre columnas). Ninguna columna desplazada.
  desplazadas: {}
  # Volado de la losa del primer piso hacia la calle, en todo el frente (dicho por el usuario 2026-10-03,
  # sin medir con cinta): 1.00 m desde la cara exterior del muro del eje 1.
  volado_p1: {lado: frente, hasta_x: -1.125, estado: aproximado}
  # La losa del altillo (+6.60) tiene el mismo volado al frente (dicho por el usuario 2026-10-03): techa la logia.
  volado_altillo: {lado: frente, hasta_x: -1.125, estado: aproximado}
  # Columnas que se propone prolongar en el altillo (revisor-estructural 2026-10-03; lo decide el ingeniero):
  # ejes A y B, con viga de encadenado arriba. Las del eje B quedan dentro de muros del departamento.
  prolongar_columnas: {altillo: [A2, A3, A4, A5, B2, B3, B4, B5]}
  escalera:
    estado: construido
    tipo: U (dos tramos con descanso junto a la pared del lado Lote 105)
    foto_obra: planos-arqui/IMG_8371.HEIC   # foto de obra, 2026-10-03
    # Caja entre los ejes 2 y 3. Se arranca del lado del eje 2 (living, junto a la columna B2),
    # se sube hacia el eje A, descanso, y se vuelve por el lado del eje 3 (comedor).
    # Confirmado por el usuario 2026-10-03.
    huella: 0.28                     # confirmado por el usuario
    contrahuella: 0.188              # 3.20 / 17 (el descanso cuenta como un escalón)
    ancho_tramo: 1.20                # según plano; NO medido
    descanso_fondo: 1.20             # según plano; NO medido -> define cuánto sobresale el 1er tramo
    pisos:
      - {desde: pb, hasta: p1, tramos: [{lado: "2", escalones: 10}, {lado: "3", escalones: 6}]}
      # Invertida para no quitar el pasaje central del primer piso; el tramo de 10 sobresale en el altillo.
      - {desde: p1, hasta: altillo, tramos: [{lado: "2", escalones: 6}, {lado: "3", escalones: 10}]}

# Albañilería (no es estructura): ladrillo y forma de asentarlo. Dato del usuario 2026-10-05.
albanileria:
  ladrillo: "cerámico 6 huecos económico rayado, 25 × 15 × 10 cm, 2.7 kg, 23 pzas/m²"
  muro_soga: 0.15     # ladrillo de soga (10) + revoques: todos los muros, salvo los de `de_cabeza`
  muro_cabeza: 0.25   # ladrillo de cabeza (25), al ras de las columnas (con revoque ~0.29)
  # Ambientes cuyos muros PERIMETRALES van de cabeza (para que no se noten las columnas).
  de_cabeza: [living]
  # Perimetrales de soga: al ras de la CARA EXTERIOR de las columnas (fachada lisa; la columna
  # sobresale ~0.10 hacia adentro). Recomendación nuestra, a confirmar con el maestro.
  perimetral_al_ras: exterior
  # Interiores de soga: centrados en el eje.

# ─────────────────────────────────────────────────────────────────────────────
# DISEÑO NUEVO (2026-10-03 en adelante). Se define pieza por pieza con el usuario.
# Lo que no está aquí todavía se dibuja en gris desde `referencia`.
#
# Ambientes: `rect: [x0, y0, x1, y1]` o `poly: [[x,y], ...]`, a eje de muro.
#   tipo: social | dormitorio | bano | cocina | servicio | circulacion | exterior
#   estado: definido (acordado con el usuario) | propuesto | aproximado
# Los bordes de los ambientes son muros de ladrillo, salvo donde `muros` o `aberturas`
# dicen otra cosa (celosía, puerta, ventana, paso abierto).
# ─────────────────────────────────────────────────────────────────────────────
ambientes:
  pb:
    - {id: terraza, nombre: Terraza libre, tipo: exterior, rect: [-2.625, -0.125, -0.125, 4.95], etiqueta: [-1.375, 4.25], estado: definido}
    - {id: acceso, nombre: Acceso, tipo: exterior, rect: [-2.625, 4.95, -0.125, 6.795], estado: definido, nota: "nivel ±0.00, llega a la puerta de entrada"}
    - {id: living, nombre: Living, tipo: social, rect: [0.00, 0.00, 4.40, 4.95], etiqueta: [2.20, 4.30], estado: definido}
    - {id: ingreso, nombre: Ingreso, tipo: circulacion, rect: [0.00, 4.95, 2.58, 6.67], estado: definido}
    - id: deposito_patio
      nombre: Depósito patio
      tipo: servicio
      rect: [4.40, 0.00, 7.05, 2.68]      # entre columnas A2-A3-B2-B3, debajo de la escalera
      estado: definido
      nota: "Patio y herramientas. Se entra solo desde el retiro lateral (Lote 105). Bajo el descanso ~1.92 m libres; bajo el tramo de 10 baja hasta ~0.8 m junto al eje B."
    # ── Planta baja v4, aprobada 2026-10-03 ──
    - id: hall
      nombre: Hall
      tipo: circulacion
      poly: [[2.58, 4.95], [4.40, 4.95], [4.40, 4.125], [5.725, 4.125], [5.725, 2.68], [7.05, 2.68], [7.05, 6.67], [2.58, 6.67]]
      estado: definido
      nota: "frente a la grada; une ingreso, living, grada y pasillo"
    # Lado retiro: baño mínimo junto a la grada, estudio, comedor (más corto).
    - {id: bano_pb, nombre: Baño, tipo: bano, rect: [7.05, 0.00, 8.85, 2.68], etiqueta: [8.10, 2.15], estado: definido, nota: "completo, ~1.65 libres: ducha al fondo bajo ventana alta, inodoro, lavamanos junto a la puerta"}
    - {id: estudio, nombre: Estudio / invitados, tipo: dormitorio, rect: [8.85, 0.00, 13.00, 2.68], etiqueta: [11.05, 1.25], estado: definido, nota: "ventana al retiro"}
    - {id: comedor, nombre: Comedor, tipo: social, rect: [13.00, 0.00, 16.90, 2.68], etiqueta: [14.60, 2.45], estado: definido, nota: "6 personas; ventana al retiro y corrediza al patio"}
    - {id: pasillo_pb, nombre: Pasillo, tipo: circulacion, rect: [7.05, 2.68, 13.00, 3.73], estado: definido, nota: "eje B; la cocina se abre a su derecha y al final; 0.90 libres (0.85 en la columna B4), aceptado por el usuario"}
    # Lado vecino (ciego): lavado, almacén y cocina amplia.
    - {id: lavado, nombre: Lavado, tipo: servicio, rect: [7.05, 3.73, 9.125, 6.67], estado: definido, nota: "extractor"}
    - {id: almacen, nombre: Almacén, tipo: servicio, rect: [9.125, 3.73, 11.20, 6.67], estado: definido, nota: "escondido detrás de la cocina, se entra desde la cocina"}
    - id: cocina
      nombre: Cocina
      tipo: cocina
      poly: [[13.00, 2.68], [16.90, 2.68], [16.90, 6.67], [11.20, 6.67], [11.20, 3.73], [13.00, 3.73]]
      etiqueta: [13.95, 5.30]
      estado: definido
      nota: "amplia, en L + isla: muro del vecino (cocina, campana, torre de horno), muro del patio (lavaplatos bajo la ventana, refrigerador), isla de trabajo/desayuno mirando al comedor y al pasillo"
  p1:
    # ── Primer piso, fondo: cuartos gemelos de los hijos y sus baños (aprobado 2026-10-03) ──
    # Baños privados pegados al eje 4 (puerta desde cada cuarto) y roperos empotrados en los cuartos.
    # Entre la escalera y los baños: blancos al norte y estar al sur (entre el vestidor y el Baño 2). Cuartos en todo A4–C5.
    - id: pasillo_p1
      nombre: Pasillo
      tipo: circulacion
      poly: [[7.05, 2.68], [11.20, 2.68], [11.20, 3.88], [9.40, 3.88], [9.40, 3.73], [7.05, 3.73]]
      estado: definido
      nota: "desde la llegada de la escalera, abierto al estar; entre los baños 1.05 libres (1.00 en la columna B4): se le quitaron 15 cm al Baño 2"
    - {id: blancos, nombre: Blancos, tipo: servicio, rect: [7.05, 0.00, 9.40, 2.68], etiqueta: [8.22, 2.30], estado: definido, nota: "cuarto de blancos y limpieza, desde el pasillo; ventana chica al norte para ventilar; encima del baño de PB"}
    - {id: bano_hijo_1, nombre: Baño 1, tipo: bano, rect: [9.40, 0.00, 11.20, 2.68], etiqueta: [10.30, 2.30], estado: definido, nota: "privado del Cuarto 1 (puerta por el eje 4); ~1.65 × 2.50 libres (como el de PB); ventana al retiro; bajante por fuera en el núcleo técnico (desviarla a x ≤ 9.25 para no tapar la ventana del estudio de PB)"}
    - id: estar_p1
      nombre: Estar
      tipo: social
      poly: [[5.85, 4.20], [7.05, 4.20], [7.05, 3.73], [9.40, 3.73], [9.40, 6.67], [5.85, 6.67]]
      etiqueta: [7.60, 5.30]
      estado: definido
      nota: "sala de TV familiar, más amplia (~3.4 × 2.3 libres + la entrada; ~9.5 m²); abierta al pasillo y al hall (sin muro: se ve desde la llegada de la escalera); SIN VENTANA: el muro sur es medianero (Lote 103); muro x=5.85 sin muro debajo: ladrillo de 6 huecos; ducto de la bajante del Baño 2 en la esquina noreste"
    - {id: bano_hijo_2, nombre: Baño 2, tipo: bano, rect: [9.40, 3.88, 11.20, 6.67], etiqueta: [10.30, 5.80], estado: definido, nota: "privado del Cuarto 2 (puerta por el eje 4); ~1.65 × 2.65 libres (15 cm menos para ensanchar el pasillo), mismo ancho que el Baño 1; muro norte en y=3.88, sin muro debajo (el de PB está en 3.73): ladrillo de 6 huecos; sin ventana: extractor al retiro norte por cielo falso del pasillo y del Baño 1; encima del almacén de PB; muro x=9.40 sin muro debajo (ladrillo de 6 huecos); inodoro contra ese muro, bajante en ducto en la esquina del almacén (no en el eje 4: viga). PROPUESTO (2026-10-04): tragaluz cenital por la franja de 2 m del altillo, sobre la zona del lavamanos y la puerta: luz natural y ventilación; podría reemplazar el ducto largo del extractor por uno corto y vertical en el domo"}
    - {id: vestibulo_hijos, nombre: Vestíbulo, tipo: circulacion, rect: [11.20, 2.585, 12.50, 4.085], etiqueta: [11.85, 3.70], estado: definido, nota: "remate del pasillo; puertas a los dos cuartos"}
    - id: cuarto_hijo_1
      nombre: Cuarto 1
      tipo: dormitorio
      poly: [[11.20, 0.00], [16.90, 0.00], [16.90, 3.335], [12.50, 3.335], [12.50, 2.585], [11.20, 2.585]]
      etiqueta: [14.20, 1.70]
      estado: definido
      nota: "~5.45 × 3.15 libres; ventanas al norte (retiro) y al este (patio)"
    - id: cuarto_hijo_2
      nombre: Cuarto 2
      tipo: dormitorio
      poly: [[12.50, 3.335], [16.90, 3.335], [16.90, 6.67], [11.20, 6.67], [11.20, 4.085], [12.50, 4.085]]
      etiqueta: [14.20, 4.90]
      estado: definido
      nota: "~5.45 × 3.15 libres; ventana al este (patio). Muro entre cuartos sobre la mitad del paño de losa B–C, sin muro debajo: ladrillo de 6 huecos (liviano; los roperos ayudan con el ruido), con junta arriba; confirmar con el ingeniero"
    # ── Primer piso, frente: suite principal (aprobado 2026-10-03) ──
    # Se usa el volado de 1 m: logia frente al dormitorio y baño que avanza hasta el borde.
    - {id: hall_p1, nombre: Hall, tipo: circulacion, rect: [4.40, 2.68, 7.05, 4.20], etiqueta: [6.30, 3.95], estado: definido, nota: "llegada de la escalera; sigue al altillo, al pasillo de los chicos y a la suite principal"}
    - {id: dorm_principal, nombre: Dormitorio principal, tipo: dormitorio, rect: [0.00, 0.00, 4.40, 4.20], etiqueta: [1.50, 2.10], estado: definido, nota: "~4.25 × 4.05 libres (17 m²); muro ciego al oeste (sol de la tarde) con la TV; cabecera contra el muro de la escalera: revestimiento acústico sobre el ladrillo (a definir con el constructor; en Bolivia no se usa drywall); puerta a la logia en la esquina sur; ventana al norte"}
    - {id: logia, nombre: Logia, tipo: exterior, rect: [-1.125, 0.00, 0.00, 4.20], etiqueta: [-0.56, 3.75], estado: definido, nota: "balcón cubierto sobre el volado de 1 m (la losa del altillo vuela igual y lo techa); al sur la pared del baño, al norte muro bajo de 1.00 + celosía de madera hasta la losa (2026-10-05), baranda al frente; sombrea el dormitorio del sol de la tarde"}
    - {id: vestidor_principal, nombre: Vestidor, tipo: servicio, rect: [3.40, 4.20, 5.85, 6.67], etiqueta: [4.60, 5.45], estado: definido, nota: "~2.3 × 2.32 libres (achicado para agrandar el estar), muebles en U con pasillo de 1.20; se entra desde los lavamanos"}
    - {id: lavamanos_ppal, nombre: Lavamanos, tipo: bano, rect: [0.90, 4.20, 3.40, 6.67], etiqueta: [2.15, 5.20], estado: definido, nota: "zona abierta con doble lavamanos; da al inodoro y a la ducha, cada uno con su puerta; sin ventana: extractor en cielo falso con ducto corto al frente (por encima del inodoro)"}
    - {id: wc_ppal, nombre: Inodoro, tipo: bano, rect: [-1.125, 4.20, 0.90, 5.45], etiqueta: [0.10, 5.25], estado: definido, nota: "ambiente propio ~1.90 × 1.15, sobre el volado; ventana alta al frente"}
    - {id: ducha_ppal, nombre: Ducha, tipo: bano, rect: [-1.125, 5.45, 0.90, 6.67], etiqueta: [0.45, 5.75], estado: definido, nota: "ambiente propio ~1.90 × 1.15, sobre el volado; ventana alta al frente"}
  altillo:
    # ── Altillo: departamento temporal para un hijo casado (pareja + bebé), aprobado 2026-10-03 ──
    # Terraza adelante; franja de 2 m libre al sur (normativa); la escalera llega ADENTRO del departamento
    # (que el viento y la lluvia no bajen a los pisos de abajo). Techo de calamina oculto tras antepecho.
