            - {pos: [6.85, 6.45], tipo: movimiento, nota: "hall"}
            - {pos: [16.70, 2.90], tipo: movimiento, nota: "cocina (ve la corrediza del comedor)"}
            - {pos: [13.20, 0.25], tipo: movimiento, nota: "comedor"}
      luces_extra:
