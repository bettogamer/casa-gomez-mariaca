          sirena: {pos: [-0.05, 0.25], nota: "exterior, en la FACHADA OESTE DEL PRIMER PISO, dentro de la logia en la esquina norte, a ~+6.0 (usuario 2026-10-06): se ve desde la calle por encima del muro de 2.50 (abajo, bajo el volado, el muro la tapaba). Tubo por el muro del P1", estado: propuesto}
