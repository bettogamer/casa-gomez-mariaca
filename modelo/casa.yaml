      tablero: {pos: [4.75, 4.55], nota: "subtablero del altillo en la llegada (zona común), muro sur junto a la puerta de la terraza: los tubos salen por la cara sur de B2 (dicho por el usuario 2026-10-04) dentro del muro x=4.40, que del lado de la llegada da al hueco de la escalera y del otro a la terraza; siguen ~2 m por ese muro y el muro sur hasta el tablero. Puede llevar medidor propio si se alquila"}
    sanitario:
      # CALEFÓN DE TODA LA CASA en la terraza, contra el muro x=4.40 junto a la columna A2 (usuario 2026-10-05):
      # bajo el techo de la terraza (sin lluvia), fuera de los retiros, sin ventanas cerca. Sin termotanque.
      # Anafe eléctrico (el gas sube solo al calefón). Tanque a ~2.5 m sobre el calefón: poca presión →
      # calefón de ENCENDIDO A BAJA PRESIÓN; si no alcanza, presurizadora para TODA la casa (lo define el plomero).
      llaves:
        - {pos: [7.225, 0.56], etiqueta: "LL general altillo", estado: propuesto, nota: "2026-10-08 (plan B): frente a la cara sur del ducto de A3, dentro del mueble bajo de la esquina (se ve por el calado de la mesada)"}
        - {pos: [9.20, 0.70], etiqueta: "LL cocina"}
        - {pos: [10.95, 0.85], etiqueta: "LL baño"}
        - {pos: [11.45, 4.55], etiqueta: "LL lavandería"}
        - {pos: [3.90, 0.15], gas: true, etiqueta: "LL gas calefón"}
      bajada_tanque: {pos: [7.25, 0.20], etiqueta: "AF ↓ del tanque (ducto de A3)"}
      # 2026-10-06 (opción B aceptada, PROPUESTO): baño encima del Baño 1 (x 9.40–11.20); cocina del otro lado de su muro oeste.
      # Agua por el muro norte al baño y a la cocina; a la lavandería por el piso del paso. Caños por debajo de la mesada.
      agua_fria: [[[7.25, 0.20], [10.68, 0.20], [10.68, 0.55], [10.95, 0.55], [10.95, 2.40]], [[9.55, 0.20], [9.55, 1.20]], [[9.20, 0.20], [9.20, 1.15]], [[10.95, 2.40], [10.95, 4.40], [8.30, 4.40], [8.30, 4.745]], [[7.25, 0.20], [4.15, 0.20], [4.15, 0.55]]]
      calefon: {pos: [4.15, 0.80], estado: propuesto, nota: "calefón a gas natural de TODA la casa, en la terraza del altillo, colgado en el muro x=4.40 (cara de la terraza) junto a la columna A2, base a ~1.40. SUGERIDO: ~18–20 L/min nominal (a ~2550 m rinde ~20–25 % menos), tiro forzado, electrónico modulante, ENCENDIDO A BAJA PRESIÓN (~0.1 bar: el tanque queda ~2.5 m arriba), con protección ANTIHIELO, apto exterior. PROTECCIÓN: gabinete metálico para calefón de exterior (chapa galvanizada pintada, rejillas arriba y abajo, nunca hermético), con candado; el techo de la terraza ya lo protege de la lluvia; salida de gases por un caño que sube por encima del techo de la terraza; llave de paso del gas a la vista. Lo dimensiona y aprueba el gasista (YPFB)"}
      gas: [[-1.275, 6.435], [-0.90, 6.435], [-0.90, 0.15], [4.08, 0.15], [4.08, 0.80]]   # 2026-10-08 (plan B, variante b): del cajón gris por dentro de los antepechos de la terraza, a ~0.30 del piso
      gas_inicio: "GN ↑ del cajón gris (esquina suroeste)"
      gas_fin: "calefón"
      agua_caliente: [[[4.15, 0.80], [4.30, 0.45], [10.60, 0.45], [10.60, 0.65], [10.85, 0.65], [10.85, 2.35]], [[9.65, 0.45], [9.65, 1.20]], [[9.10, 0.45], [9.10, 1.15]], [[10.85, 2.35], [10.85, 4.30], [8.20, 4.30], [8.20, 4.745]], [[4.15, 0.80], [4.15, 0.10], [4.60, 0.10]]]
      subida_caliente: {pos: [4.60, 0.10], etiqueta: "AC ↓ a P1 y PB por el ducto de A2 (escalera)"}
      bajantes:
        - {pos: [10.93, 0.27], ambientes: [bano_alt, cocina_alt], estado: propuesto, etiqueta: "BAJANTE COMÚN (baño y cocina + Baño 1 del P1): ADENTRO, en el ducto del rincón de A4", nota: "plan B (2026-10-08): la pilastra de afuera invadía el retiro de 2.00. Ducto de ladrillo en el rincón noroeste de A4, al lado oeste (en el este estaban las ventanas del Cuarto 1 y del estar), en el baño del altillo, el Baño 1 y el estudio; pases por el plastoformo entre viguetas en (10.93, 0.27), lejos de las vigas A y 4 (ingeniero, pregunta 8); en PB baja bajo el piso a la cámara nueva (10.93, -0.85). Ventila sobre el techo del departamento. Recibe el inodoro (salida a la pared, ~0.5 m), la ducha y el lavamanos del altillo, el lavaplatos de la cocina del altillo y el Baño 1 del P1"}
        - {pos: [9.60, 4.85], ambientes: [franja_sur_alt], hasta: p1, etiqueta: "lavandería → baja por el Baño 2 del P1 (desagüe ~1.7 m por el contrapiso; pase entre viguetas, sin tocar el nervio)"}
      # NO SE PICA LA LOSA del altillo para el baño (2026-10-06, opción B aceptada): el desnivel de la ducha y las pendientes
      # salen del contrapiso (~15 cm; el ingeniero define si va alivianado). Inodoro de preferencia con SALIDA A LA PARED, con
      # el caño por el muro norte hasta la bajante A4. Pase en la losa SOLO si el plomero no lo puede evitar: entre viguetas
      # (no se cortan), dentro del cielo falso del Baño 1, después de ubicar las viguetas desde abajo.
      sumideros:
        - {pos: [10.20, 0.30], estado: propuesto, etiqueta: "inodoro: salida a la pared → A4 (pase en losa solo si no hay otra)"}
        - {pos: [9.85, 2.10], estado: propuesto, etiqueta: "sumidero de la ducha: sifón en el contrapiso, sin picar la losa"}
    ventilacion:
