verificar_en_obra:
  - "Comprobar que lo construido siguió IMG_8278: tramo del fondo 5.70 m (el PDF decía 4.50 m)."
  - "Sección real de columnas (se asume 25x25) y espesor de losas."
  - "Distancia de la casa al lindero del fondo (5.00 m) y al lateral del Lote 105 (2.01 m)."
  - "Volado de la losa del primer piso al frente: medir cuánto sale (se asume 1.00 m desde la cara del muro) y su espesor en la punta. El baño principal y la logia van encima."
  - "Cuánto cuelga la viga del eje A entre A2 y A3 bajo la losa del altillo (define el alto de la ventana de la escalera)."
  - "Espacio por fuera entre la puerta de entrada y la columna C1 (bajante de la suite principal)."
  - "¿Hay viga en el eje 1 (A1–B1 y B1–C1) y cuánto cuelga?"
  - "¿Hay viga en el eje A entre A1 y A2 a +3.40 y cuánto cuelga? (dintel de la ventana del living de 3.00)"
  - "Logia de la suite (P1): muro bajo de 1.00 + celosía de madera en el costado norte, en la punta del volado: el ingeniero confirma el peso y el anclaje de la celosía a la losa del altillo; el arquitecto, que con celosía no hay vista directa al Lote 105 (logia a 2.01 del lindero)"
  - "Tanque elevado: base subida a +10.50 (~2.5 m sobre la entrada del calefón del altillo). Base propia de hormigón sobre A3 y el muro de la escalera, aún no construida: el ingeniero la dimensiona con la nueva altura (más palanca con viento y sismo)"
  - "Calefón en la terraza del altillo (junto a A2): el gasista confirma con YPFB la subida de gas a la vista por la fachada norte, la salida de gases por encima del techo de la terraza y las distancias; el plomero, que el modelo elegido encienda con ~0.25 bar (si no, presurizadora para toda la casa)"
  - "Hall del P1: borde real del hueco de la losa del altillo sobre el hall (define si la luz del hall es plafón o aplique a 2.20). Contrapiso de los baños del P1: que dé la pendiente para el inodoro del Baño 1 (~1 m hasta la bajante) y el lavamanos del Baño 2 (~3 m) sin tocar viguetas"
  - "Muros perimetrales de soga al ras de la cara exterior de las columnas (recomendación, 2026-10-05): confirmar con el maestro. Junto a la escalera (muro norte A2–A3) el muro de soga queda ~10 cm antes del borde del descanso: ¿el descanso está pegado a la cara exterior? Si queda luz, rellenar o engrosar ese tramo"
  - "Eje 1 entre A1 y B1: hay cimiento corrido y aún no hay muro (confirmado por el usuario 2026-10-05). El ingeniero define cómo atar el muro nuevo a A1/B1 (chicotes con epóxico o malla) y su remate contra la viga"
  - "¿Hay losa o hueco sobre el arranque de la escalera de PB (x 4.40–5.725, y 2.68–4.20)? ¿Dónde está el borde del hueco y si tiene viga de borde? Define el hall del primer piso."
  - "Altillo: confirmar con el arquitecto el retiro de 2 m al sur (desde dónde se mide), la altura máxima y el número de plantas permitidos."
  - "Tanque elevado (3–4 t con base y forro): sobre la columna A3 prolongada + otra columna (B3 o A2) con vigas de mesa; la mitad cae sobre el hueco de la escalera. Forro liviano si es posible. Lo dimensiona el ingeniero."
  - "Altillo: ¿quedaron varillas de espera en lo alto de las columnas (+6.60)? Cuántas, diámetro y largo (define la prolongación de columnas)."
  - "Losa del altillo: espesor real, maciza o alivianada, y dónde hay vigas (ejes A, B, C y 2–5); borde y viga del hueco de la escalera."
  - "Altillo: pendientes y desagües pluviales de la terraza y de la franja (son losa descubierta): sumideros, bajantes pluviales e impermeabilización."
  - "Altillo: ¿prolongar columnas para el muro sur (y=4.67, sin viga debajo) y para el techo de calamina? Lo define el ingeniero."
  - "Altillo: presión de agua (el tanque queda ~1.5 m sobre la ducha): bomba presurizadora o tanque más alto; lo define el plomero."
  - "Columna B2: tubitos para los cables en las dos losas (+3.40 y +6.60), al lado sur de la columna (dicho por el usuario). Contar cuántos y de qué diámetro. En PB no hay camino: se propone tubo por debajo del contrapiso desde el TD del ingreso hasta el muro x=4.40 (definirlo ANTES de hacer el piso; lo confirma el electricista)."
  - "P1 (2026-10-04): ¿la losa B2-B3-C2-C3 aguanta el muro nuevo del vestidor en x=5.85 (2.47 m de ladrillo de 6 huecos, en medio del paño, en L con el de y=4.20) más los roperos? Si no: ropero de piso a techo como división."
  - "P1: muro norte del Baño 2 en y=3.88, corrido 15 cm del muro de PB (y=3.73): ¿se acepta? Impermeabilizar (ducha pegada)."
  - "P1: ¿cuánto cuelga la viga del eje 3 (B3–C3) bajo la losa del altillo? Queda a la vista en el techo del estar."
  - "P1: bajante del Baño 2 en la esquina noreste del estar (≈9.30, 3.85) → almacén de PB: ¿pase de losa libre de vigas? El inodoro queda a ~1.4 m del ducto: desnivel suficiente o por cielo falso del almacén."
  - "Normativa (OM 4100/10 art. 44): la franja sur y la terraza sur llegan al lindero del Lote 103; se propone muro ciego de ~1.80 (sin vista directa) y semisombra desmontable sobre la lavandería. Confirmar con el arquitecto que así se aprueba."
  - "Viguetas (docs/viguetas.md): las dos losas son iguales (confirmado). Falta el espesor total de la losa y qué es la franja amarilla del paño 1–2 B–C. El paño 2–3 B–C tiene solo 4 viguetas en 2.65 m: ¿parte es hueco sobre el arranque de la escalera?"
  - "LLEGADA DEL ALTILLO (usuario 2026-10-05, con foto): junto a B2 el hueco termina en el eje B y hay losa entre B2 y la escalera; sobre el tramo de 10 el hueco pasa el eje B (escalera hecha, llega larga). Medir: ancho y largo exactos del hueco extra (se supone x 5.725–7.05, y 2.68–3.85), si hay viga B entre B2 y el hueco y cuánto cuelga (para el muro propuesto sobre el eje B), y cómo apoyan ahí las viguetas del paño B–C (brocal)"
  - "Viguetas: muros nuevos PARALELOS a las viguetas, sin muro debajo: vestidor x=5.85 y Baño 2 x=9.40 (P1), vestíbulo x=12.50 (P1), muro x=13.00 (altillo). El ingeniero decide si van de ladrillo de 6 huecos, con refuerzo, o como mueble de piso a techo."
  - "Viguetas pretensadas: no se cortan. Ubicar cada pase de bajante o ducto entre viguetas antes de perforar."
  - "PROPUESTO — tragaluz del Baño 2 (revisor estructural 2026-10-04; ranuras acortadas 2026-10-05 para el paso de 0.65 al norte del domo): dos ranuras de ~0.30 × 0.60 (y 5.50–6.10; domo y 5.40–6.20) centradas entre viguetas, a ≥0.5 de la viga C; borde macizado ~10 cm con fierro perimetral y diagonales; brocal de hormigón vaciado con el borde, membrana subida 15–20 cm, domo tipo gorro antivandálico o con reja; ≥0.40 libres hacia el antepecho sur. ANTES de abrir medir desde abajo: posición real y ancho de las viguetas entre x 9.40 y 11.20, espesor de losa, ancho de la viga C y franja maciza, nervio transversal. Si las viguetas no dejan lugar: tubos solares de 25–35 cm. Lo aprueba el ingeniero."
  - "Tanque elevado: definir capacidad y medidas reales (en el 3D se dibuja uno de ~2500 L, 1.60 × 1.60 × 1.80 forrado, sobre base a +10.20; supuesto)."
  - "¿Las vigas de la losa del primer piso cuelgan bajo la losa? ¿Cuánto (sobre todo eje B y eje A, ejes 3-4)? Define la altura del cielo falso del lavado y el baño."
  - "PB, ANTES DEL CONTRAPISO (interiorista 2026-10-05): rebaje de ~5–8 cm para la ducha del baño al ras del piso (con cancel); tubo eléctrico del muro sur de la cocina a la isla (enchufe de la isla); tubo del TD a la columna B2 (montante); desagüe de la bajante del Baño 2 (P1), que baja en el rincón noroeste del almacén (≈9.30, 3.85), hasta el colector del retiro norte (pasa bajo el pasillo y el estudio; registro accesible); desagües de lavadora, lavadero y lavadora manual; agua y desagüe del lavavajillas; agua fría para el dispensador del refrigerador."
  - "Losa del primer piso (ya hecha): ¿dejaron cajas de luz o tubos embutidos? ¿Dónde? Probablemente no coinciden con las luces del diseño nuevo; las nuevas van entre viguetas (sin cortarlas). Lo resuelve el electricista."
