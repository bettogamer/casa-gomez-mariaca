# Modelo de la casa — fuente de verdad del proyecto.
#
# Todo lo que se dibuja (plantas SVG, visor 3D, DXF, reporte) se genera desde
# este archivo con `make build`. Para modificar la casa se edita AQUÍ, nunca
# los archivos de `salida/`.
#
# Sistema de coordenadas (metros):
#   x = a lo largo de la casa, 0 en el eje 1 (lado terraza / calle), crece hacia el fondo.
#   y = a lo ancho, 0 en el eje A (lado Lote 105), crece hacia el Lote 103.
#   Ambos ejes se miden a CENTRO de columna. La pared exterior queda ~0.125 m afuera.
#
# Leyenda de `estado` en cada elemento:
#   construido   -> ya existe en obra. NO se modifica sin verificarlo con cinta métrica.
#   aproximado   -> digitalizado de foto; medidas a ±10-20 cm. Confirmar.
#   propuesto    -> modificación nuestra, todavía no aprobada.
#   pendiente    -> falta información.

proyecto:
  nombre: Vivienda unifamiliar
  ubicacion: Cochabamba — Subalcaldía Alejo Calatayud, Distrito 5, Zona Lacma, Mz 101, Lote 4
  codigo_catastral: 05-17-101-063-0-00-000-000
  calle: Pasaje innominado / Calle Víctor Rodrigo (9.00 m)
  fuente_base: >
    Fotos del juego impreso (planos-arqui/IMG_8276..8278, ago-2026). NO coincide
    con el PDF "PLANO DE const. 06-03.pdf" (versión anterior, feb-2020). Ver
    docs/versiones-del-plano.md.
  # Cuaderno de obra impreso (make cuaderno). La v1 (2026-10-12) ya está impresa y en manos del maestro: cada versión
  # nueva dice qué cambió y qué hojas reemplazar, y además sale un PDF corto solo con las hojas nuevas.
  cuaderno:
    version: "2.0"
    fecha: 2026-10-16
    reemplazar: "Todas las hojas del ALTILLO (plano, muros, puertas y ventanas; las del techo son nuevas) y la hoja «Ladrillo y forma de asentar». Las de planta baja y primer piso también cambian, pero se pueden imprimir cuando el albañil llegue a esos pisos."
    cambios:
      - "MUROS SOBRE LA LÍNEA DE COLUMNAS: ya no van centrados. Van AL RAS DE UNA CARA de la columna (el plano dice cuál; la columna asoma 10 cm del otro lado). Los de afuera, al ras de la cara de afuera, también el del altillo que da a la terraza (eje 2)."
      - "PUERTAS Y VENTANAS JUNTO A UNA COLUMNA: van AL RAS de la columna (sin pedacito de ladrillo, que no agarra el marco). Altillo: ventana alta del estar (A4), ventana del dormitorio al patio (B5) y puerta del baño (B4). Primer piso: ventana del Cuarto 1, puertas de blancos, Baño 2 y de los dos cuartos. Planta baja: puerta del depósito."
      - "ALTILLO: PUERTAS MÁS ANCHAS (hueco que deja el albañil): a la terraza 1.00, al dormitorio 1.00, al baño 0.85 (más ancha choca con la ducha), entrada al departamento 0.75 (no entra más: al lado están los últimos escalones). Todas pegadas al muro o a la columna."
      - "ALTILLO: LA CORREDIZA VA FRENTE AL ESTAR (no en el comedor): 2.00 en x 11.35 a 13.35, centrada en el sofá; ya no hay ventana sur en el estar y entre x 9.40 y 11.35 el muro sur queda CIEGO. En el comedor, donde estaba la corrediza, va una ventana de 1.00 × 1.10 (V7). Los muebles grandes entran por la terraza, la franja y la corrediza."
      - "ALTILLO: PILETAS Y LAVADORA AL OESTE de la franja, bajo la ventana del comedor (V7). Los caños de agua llegan bajo esa ventana; el desagüe va por el contrapiso de la franja hasta la bajada de siempre (x 9.60)."
      - "ALTILLO, TECHO: dos hojas nuevas (planta y corte). Los muros de afuera del departamento suben DE UNA VEZ hasta +10.20 (el antepecho es el mismo muro). Lo que se deja en los muros (gárgolas, anclajes del techo de la terraza) y lo que falta decidir antes de techar."
      - "LOS PLANOS DEL ALBAÑIL TRAEN LAS MEDIDAS DIBUJADAS: cada puerta y ventana con su código (V1, P1, C1), ancho × alto y antepecho, y una cadena de medidas de cara a cara de columnas y muros. Y una hoja con cada puerta y ventana VISTA DE FRENTE con sus alturas desde el piso."

lote:
  largo: 37.25          # P1-P2 (colinda Lote 105, Jesús Maldonado)
  ancho: 9.02           # P1-P4 (frente a la calle)
  # Posición del lote en coordenadas de la casa (esquina P1 = arriba-izquierda).
  origen_x: -15.225     # = fondo(22.025) - 37.25
  origen_y: -2.135      # retiro lateral 2.01 m + media pared
  retiro_fondo: 5.00    # de la pared del fondo al lindero P2-P3
  # Orientación deducida del usuario: el frente recibe sol pleno a las 17:00 -> frente al OESTE.
  # Con el plano sin espejar: eje A / retiro lateral (Lote 105) = NORTE (lado soleado),
  # eje C / vecino (Lote 103) = SUR, patio del fondo = ESTE (sol de mañana).
  orientacion: {frente: oeste, lado_A: norte, lado_C: sur, fondo: este, norte_en_planta: [0, -1]}
  estacionamiento: "2 autos EN FILA pegados al norte (Lote 105), portón corredizo de una hoja de 3.20 con motor + puerta peatonal al sur; ver ambientes.pb.estacionamiento (propuesto 2026-10-06; reemplaza la versión lado a lado del 2026-10-05)"
  # Exteriores del frente (propuesto 2026-10-05): jardín delantero de x -15.225 (línea de la calle) a -2.625 (terraza),
  # 12.45 m libres de fondo (cara interior del muro de la calle en x -15.075) × 8.93 de ancho (y -2.135 a 6.795; los
  # muros laterales de los vecinos pueden comer ~0.08–0.15 de cada lado: medir). Muro de la calle alto y ciego.
  # Normativa: Reglamento Complementario a la Normativa Urbana, OM 4100/10 (reglamento/, resumen en docs/normativa.md).
  # Zona de Renovación de la Imagen Urbana, edificación aislada; frente 9.02 (8.01–10.00) y vía 9.00 (9.00–12.50):
  # 3 plantas = PB y 1er piso con un retiro lateral de 2.00 (incluido voladizo) y apoyo en el otro; 2do piso
  # (altillo) con 2.00 m en AMBOS laterales, sin volado; retiro de fondo ≥ 3.00; voladizo frontal ≤ 1.20.
  # El 2.00 del sur se toma desde la cara del muro medianero (y=6.795): muro del altillo en y=4.67 (cara 4.795).
  retiro_altillo_sur: 2.00
  normativa: {ordenanza: "OM 4100/10", zona: "Renovación de la Imagen Urbana — edificación aislada", plantas_max: 3, retiro_lateral: 2.00, retiro_fondo_min: 3.00, voladizo_frontal_max: 1.20}
  colindantes:
    arriba: Lote 105 — Jesús Maldonado
    abajo: Lote 103 — Germán Sánchez
    fondo: Lote 95 — Rubén Pérez
    frente: Calle Víctor Rodrigo

# Alturas: el usuario cambió en obra a 3.00 m LIBRES (piso a techo), no 3.00 piso a piso
# como decía el plano. Piso a piso = 3.00 + espesor de losa (0.20 supuesto) = 3.20.
# Las cotas cambian si se mide otro espesor de losa.
niveles:
  - id: pb
    nombre: Planta baja
    cota: 0.20          # nivel de piso terminado (según plano)
    altura_libre: 3.00  # piso a techo — confirmado por el usuario
    altura: 3.20        # piso a piso = libre + losa
  - id: p1
    nombre: Primer piso
    cota: 3.40
    altura_libre: 3.00
    altura: 3.20
  - id: altillo
    nombre: Altillo
    cota: 6.60
    altura_libre: 3.00  # altillo aún sin techo construido; altura por definir
    altura: 3.20
    # Techo: ver la sección `techos` (planta de techos, 2026-10-04). Calamina a un agua hacia el sur, oculta tras el
    # antepecho; la terraza con su propio techo de calamina sobre fierro.
    techo: {tipo: calamina, oculto: true, pendiente_hacia: sur, estado: definido}

estructura:
  estado: construido
  nota: Columnas, losas y escalera YA construidas. Son la restricción principal del diseño.
  seccion_columna: 0.25 # 25x25 estimado por el usuario (sin medición)
  espesor_losa: 0.20    # supuesto; medir en obra
  # Losas construidas (2026-10-03): piso del primer piso (+3.40) y piso del altillo (+6.60),
  # recién terminada. El altillo NO tiene techo todavía; columnas llegan hasta +6.60.
  losas_construidas: [p1, altillo]
  # Tipo de losa: alivianada con viguetas pretensadas T.S.D. (reforzadas, 5 alambres dobles) + plastoformo.
  # Fuente: planos-arqui/PLANO ViGETAS.pdf (pedido del proveedor). El usuario confirmó (2026-10-04) que las DOS losas
  # (+3.40 y +6.60) se armaron igual. Lectura en docs/viguetas.md. dir: y = viguetas de norte a sur (de eje A a C),
  # x = de oeste a este. n y largo = lo pedido; la ubicación exacta de cada vigueta no está en el plano.
  viguetas:
    tipo: "alivianada: viguetas pretensadas + plastoformo (espesor total sin medir)"
    igual_en: [p1, altillo]
    panos:
      - {rect: [11.20, 0.00, 16.90, 2.68], dir: y, n: 11, largo: 2.85}
      - {rect: [11.20, 2.68, 16.90, 6.67], dir: y, n: 11, largo: 4.05}
      - {rect: [7.05, 0.00, 11.20, 2.68], dir: x, n: 5, largo: 4.20}
      - {rect: [7.05, 2.68, 11.20, 6.67], dir: y, n: 7, largo: 4.05}
      - {rect: [4.40, 2.68, 7.05, 6.67], dir: y, n: 4, largo: 4.05}
      - {rect: [0.00, 0.00, 4.40, 2.68], dir: y, n: 8, largo: 2.85}
      - {rect: [0.00, 2.68, 4.40, 6.67], dir: y, n: 7, largo: 4.05, nota: "más una franja marcada en amarillo junto al eje 2 (¿maciza?)"}
      - {rect: [-1.125, 0.00, 0.00, 2.68], dir: y, n: 2, largo: 2.85, nota: "volado"}
      - {rect: [-1.125, 2.68, 0.00, 6.67], dir: y, n: 2, largo: 4.05, nota: "volado"}
    hueco: {rect: [4.40, 0.00, 7.05, 2.68], nota: "escalera (paño 2–3 A–B, cruz en el plano)"}
    # En la losa del altillo el hueco sigue más allá del eje B sobre el tramo de 10 de la escalera P1→altillo
    # (confirmado por el usuario 2026-10-05 con foto: junto a B2 el hueco termina en el eje B y hay losa entre B2 y
    # la escalera; los últimos escalones pasan el eje B). Medidas leídas del modelo de la escalera: medir en obra.
    huecos_extra:
      - {nivel: altillo, rect: [5.725, 2.68, 7.05, 3.85], estado: aproximado, nota: "sobre el tramo de 10 (escalones 13–16); ahí las viguetas del paño B–C son más cortas o arrancan en un brocal"}
  # Ejes según planos-arqui/IMG_8278.png: plano con el que se construyeron las columnas
  # (confirmado por el usuario 2026-10-03). IMG_8278 copy.png = misma foto + línea roja B4-B5
  # que solo indica la distancia de ese tramo (no es viga ni muro).
  ejes_x: {"1": 0.00, "2": 4.40, "3": 7.05, "4": 11.20, "5": 16.90}
  ejes_y: {A: 0.00, B: 2.68, C: 6.67}
  # Columnas = intersecciones de ejes, salvo las listadas en `desplazadas`.
  columnas_en: [A1, A2, A3, A4, A5, B1, B2, B3, B4, B5, C1, C2, C3, C4, C5]
  # La cota 4.10 entre 1' y 2' en IMG_8278 es error de dibujo: C1-C2 = 4.40 (comprobado con la
  # planta 1º piso IMG_8277, dormitorio de 4.35 entre columnas). Ninguna columna desplazada.
  desplazadas: {}
  # Volado de la losa del primer piso hacia la calle, en todo el frente (dicho por el usuario 2026-10-03,
  # sin medir con cinta): 1.00 m desde la cara exterior del muro del eje 1.
  volado_p1: {lado: frente, hasta_x: -1.125, estado: aproximado}
  # La losa del altillo (+6.60) tiene el mismo volado al frente (dicho por el usuario 2026-10-03): techa la logia.
  volado_altillo: {lado: frente, hasta_x: -1.125, estado: aproximado}
  # Columnas que se propone prolongar en el altillo (revisor-estructural 2026-10-03; lo decide el ingeniero):
  # ejes A y B, con viga de encadenado arriba. Las del eje B quedan dentro de muros del departamento.
  prolongar_columnas: {altillo: [A2, A3, A4, A5, B2, B3, B4, B5]}
  escalera:
    estado: construido
    tipo: U (dos tramos con descanso junto a la pared del lado Lote 105)
    foto_obra: planos-arqui/IMG_8371.HEIC   # foto de obra, 2026-10-03
    # Caja entre los ejes 2 y 3. Se arranca del lado del eje 2 (living, junto a la columna B2),
    # se sube hacia el eje A, descanso, y se vuelve por el lado del eje 3 (comedor).
    # Confirmado por el usuario 2026-10-03.
    huella: 0.28                     # confirmado por el usuario
    contrahuella: 0.188              # 3.20 / 17 (el descanso cuenta como un escalón)
    ancho_tramo: 1.20                # según plano; NO medido
    descanso_fondo: 1.20             # según plano; NO medido -> define cuánto sobresale el 1er tramo
    pisos:
      - {desde: pb, hasta: p1, tramos: [{lado: "2", escalones: 10}, {lado: "3", escalones: 6}]}
      # Invertida para no quitar el pasaje central del primer piso; el tramo de 10 sobresale en el altillo.
      - {desde: p1, hasta: altillo, tramos: [{lado: "2", escalones: 6}, {lado: "3", escalones: 10}]}

# Albañilería (no es estructura): ladrillo y forma de asentarlo. Dato del usuario 2026-10-05.
albanileria:
  ladrillo: "cerámico 6 huecos económico rayado, 25 × 15 × 10 cm, 2.7 kg, 23 pzas/m²"
  muro_soga: 0.15     # ladrillo de soga (10) + revoques: todos los muros, salvo los de `de_cabeza`
  muro_cabeza: 0.25   # ladrillo de cabeza (25), al ras de las columnas (con revoque ~0.29)
  # Ambientes cuyos muros PERIMETRALES van de cabeza (para que no se noten las columnas).
  de_cabeza: [living]
  # Perimetrales de soga: al ras de la CARA EXTERIOR de las columnas (fachada lisa; la columna
  # sobresale ~0.10 hacia adentro). Recomendación nuestra, a confirmar con el maestro.
  perimetral_al_ras: exterior
  # Unión muro–columna y muro–losa (revisión del arquitecto, punto 6, 2026-10-07; PROPUESTO, lo confirma el ingeniero).
  # El ladrillo y el hormigón se mueven distinto: sin esto, cada columna y cada borde de losa se marca como fisura en la fachada.
  union_columnas:
    estado: propuesto
    chicotes: "MIENTRAS SE LEVANTA el muro: chicotes de fierro de 6 mm cada 3 hiladas (~0.45 de alto), anclados a la columna con epóxico (perforación de ~10 cm) y metidos ~0.50 en la junta del ladrillo"
    remate_losa: "última hilada bajo viga o losa: junta llena y apretada (o mortero expansivo), sin dejar hueco"
    malla_revoque: "en el REVOQUE EXTERIOR, malla (de fibra de vidrio o metálica) de 0.30 de ancho, 0.15 a cada lado de cada columna y de cada viga o borde de losa, embebida en la primera capa"
    nota: "aplica a todos los muros perimetrales de soga al ras de las columnas (fachadas blancas). Pregunta 12 de docs/preguntas-ingeniero.md"
  # Muros de soga SOBRE UN EJE de columnas (2026-10-16, pedido del maestro: centrados, la columna asoma 5 cm por
  # cada lado y hay que dibujarlos bien): van AL RAS DE UNA CARA de la columna. Regla automática (tools/casa.py,
  # lado_al_ras): afuera > escalera > ambiente más importante (dormitorio/estar > cocina > pasillo > baño > depósito).
  # Aquí, los tramos que se corrigen a mano (lado = hacia dónde queda la cara lisa al ras de la columna).
  # Los tabiques que no van sobre un eje siguen centrados en su línea.
  al_ras:
    pb:
      - {y: 2.68, desde: 4.40, hasta: 13.00, lado: norte}   # eje B parejo: pasillo de 0.95 sin escalón en x 8.85; entra la cajonera bajo la grada
      - {x: 7.05, desde: 3.73, hasta: 6.67, lado: este}     # hall liso (abrigos y banca); la columna C3 asoma al lavado
      - {x: 11.20, desde: 3.73, hasta: 6.67, lado: oeste}   # cocina sin cambios (alacena); la columna C4 asoma en el rincón de la cocina
    altillo:
      - {x: 7.05, lado: oeste}                              # todo el eje 3 del lado de la escalera
      - {y: 2.68, desde: 4.40, hasta: 5.725, lado: norte}   # muro de la llegada: al ras del hueco de la escalera

# ─────────────────────────────────────────────────────────────────────────────
# DISEÑO NUEVO (2026-10-03 en adelante). Se define pieza por pieza con el usuario.
# Lo que no está aquí todavía se dibuja en gris desde `referencia`.
#
# Ambientes: `rect: [x0, y0, x1, y1]` o `poly: [[x,y], ...]`, a eje de muro.
#   tipo: social | dormitorio | bano | cocina | servicio | circulacion | exterior
#   estado: definido (acordado con el usuario) | propuesto | aproximado
# Los bordes de los ambientes son muros de ladrillo, salvo donde `muros` o `aberturas`
# dicen otra cosa (celosía, puerta, ventana, paso abierto).
# ─────────────────────────────────────────────────────────────────────────────
ambientes:
  pb:
    - {id: terraza, nombre: Terraza libre, tipo: exterior, rect: [-2.625, -0.125, -0.125, 4.95], etiqueta: [-1.375, 4.25], estado: definido, nota: "PISO: deck de PVC tipo madera (WPC, decisión del usuario 2026-10-05) sobre rastreles de aluminio o WPC cada ~0.35, encima del contrapiso con pendiente 1–2 % hacia el jardín y juntas de dilatación; color claro (da al oeste: el WPC oscuro se calienta con el sol de la tarde). NO es para estacionar. Borde oeste con perfil de remate contra la vereda"}
    - {id: acceso, nombre: Acceso, tipo: exterior, rect: [-2.625, 4.95, -0.125, 6.795], estado: definido, nota: "nivel +0.02 (propuesto 2026-10-08, ver niveles_piso), llega a la puerta de entrada con un escalón de 0.18"}
    # ── Exteriores del frente (PROPUESTO 2026-10-06, pedido del dueño: autos en fila al norte, puerta peatonal al sur) ──
    # Franjas de norte a sur: estacionamiento en fila 3.40 (contra el Lote 105) | pasto 4.03 | camino 1.50 recto de la puerta
    # peatonal a la puerta de entrada (contra el Lote 103). Muro de la calle, de norte a sur: pilar 0.20 | portón 3.20 |
    # muro 3.45 (detrás se guarda la hoja) | pilar 0.685 (medidor de luz, videoportero) | puerta peatonal 0.90 | pilar 0.585 (medidor de gas).
    - id: estacionamiento
      nombre: Estacionamiento (en fila)
      tipo: exterior
      rect: [-15.075, -2.135, -2.625, 1.265]
      etiqueta: [-9.50, -0.40]
      estado: propuesto
      nota: "2 autos EN FILA, pegados al lindero norte: carril de 3.40 × 12.45. Cajón de afuera x -14.85 a -9.85 y cajón de adentro x -9.35 a -4.35 (5.00 cada uno, 0.50 entre autos); al fondo quedan ~1.70 libres que llevan al retiro norte y a la vereda. Auto a ~0.60 del lindero norte (y -1.535 a 0.325) y franja de 0.94 pavimentada del lado del pasto (y 0.325 a 1.265) para abrir puertas sin pisar pasto. Conviene entrar de RETRO: el conductor baja del lado de la franja; de punta, del lado del lindero quedan ~0.55–0.60 (justo, espejo plegado). Afuera, el auto que sale primero de mañana. Debajo pasan el colector (y -0.85) y el tramo de la cámara final, bajo el centro del auto: colector PVC de pared reforzada a ≥0.60 o encamisado en hormigón, cámaras de hormigón o ladrillo macizo con tapa y marco para tránsito (las ruedas no siempre pasan por el mismo lugar), pase o camisa donde cruza bajo la viga del riel, cámara final a ≥1 m del muro. El GAS ya no pasa bajo los autos (va por el camino y la vereda; solo cruza el fondo, x -3.30, con funda). TOPE DE RUEDAS en x -5.10 (cerco tope_autos): el auto de adentro no sigue hacia el retiro norte (cámaras, gas e impulsión) ni hacia la columna A1. Hormigón o adoquín, pendiente 1–2 % hacia la calle con rejilla lineal por dentro del portón (a lo pluvial)"
    - id: jardin
      nombre: Jardín (pasto)
      tipo: exterior
      rect: [-15.075, 1.265, -3.425, 5.295]
      etiqueta: [-8.00, 3.00]
      estado: propuesto
      nota: "SOLO PASTO esmeralda (usuario), sin plantas ni árboles. Drenaje: pendiente ~1.5–2 % y salida (dren de grava al pie de la vereda o rejilla a lo pluvial). Junto al muro de la calle, de y 1.265 a 4.715, franja de hormigón de ~0.35 para el riel y la hoja del portón abierta. Riego con canilla o aspersores (a definir). Gatos: nada pegado a los muros que sirva de escalón"
    - id: camino
      nombre: Camino
      tipo: exterior
      rect: [-15.075, 5.295, -2.625, 6.795]
      etiqueta: [-9.00, 6.15]
      estado: propuesto
      nota: "camino RECTO de 1.50 de la puerta peatonal (y 5.40–6.30) a la puerta de entrada (x 0, y 5.32–6.37), pasando por el acceso; llega hasta el muro sur (Lote 103), sin franja de pasto suelta. Bajo el camino (2026-10-06): la CISTERNA (x -13.75 a -10.25) con su tapa y, al sur de la puerta, la cámara de la bomba; por el borde norte, la impulsión (y 5.20) y el cable del medidor de luz y del portero (y ~5.00). El GAS va a la vista por la cara del muro sur a ~0.15 (con protección) y baja a tierra en x -3.30. Fuera de la cisterna, el relleno de la vieja: compactar en capas. Luz (interiorista 2026-10-06): 5 balizas empotradas en el muro sur a 0.40 cada 2.50 y luz con sensor sobre la puerta peatonal, circuito C27 (fotocélula + reloj)"
    - id: vereda_terraza
      nombre: Vereda
      tipo: exterior
      rect: [-3.425, 1.265, -2.625, 5.295]
      estado: propuesto
      nota: "vereda de 0.80 delante de la terraza: une el fondo del estacionamiento con el camino y el acceso sin pisar pasto, y protege el borde del deck. Por debajo suben la impulsión (x -3.025) y el gas (x -3.30) hacia el retiro"
    - id: retiro_norte_arranque
      nombre: Retiro norte
      tipo: exterior
