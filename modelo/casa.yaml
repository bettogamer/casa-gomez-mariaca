        - id: baño 2
          linea: [[10.85, 6.10], [10.85, -0.20]]
          diametro: 100
          extractor: true
          estado: definido
          nota: "extractor del Baño 2 de los hijos → retiro norte por cielo falso del pasillo y del Baño 1"
        - id: lavamanos
