    - {id: living, nombre: Living, tipo: social, rect: [0.00, 0.00, 4.40, 4.92], estado: aproximado}
    - {id: ingreso, nombre: Ingreso, tipo: circulacion, rect: [0.00, 5.07, 2.51, 6.67], estado: aproximado}
    - id: estar
      nombre: Estar
      tipo: social
      poly: [[2.66, 4.92], [4.40, 4.92], [4.40, 3.98], [7.05, 3.98], [7.05, 6.67], [2.66, 6.67]]
      estado: aproximado
    - {id: comedor, nombre: Comedor, tipo: social, rect: [7.05, 0.00, 11.20, 4.17], estado: aproximado}
    - {id: cocina, nombre: Cocina, tipo: cocina, rect: [7.05, 4.17, 11.20, 6.67], estado: aproximado}
    - {id: bano_pb, nombre: Baño, tipo: bano, rect: [11.25, 0.00, 13.05, 2.23], estado: aproximado}
