# ─────────────────────────────────────────────────────────────────────────────
# PLANTA DE TECHOS (2026-10-04; ESQUEMA para conversar con el ingeniero y el techador). Todo de calamina.
# - Departamento: techo OCULTO detrás de un antepecho en los cuatro lados (caja recta), a un agua al sur.
# - Terraza: techo aparte de calamina sobre estructura de fierro a la vista (postes y vigas), más bajo que el
#   antepecho del departamento, con caída hacia el FRENTE y canaleta vista en el borde (pedido del usuario).
# - Nada vuela sobre la franja de 2 m del sur (OM 4100/10: separación lateral SIN VOLADO en el 2do piso). Sobre la
#   lavandería, semisombra liviana y desmontable.
# Cotas aproximadas: las define el ingeniero.
# ─────────────────────────────────────────────────────────────────────────────
techos:
  material: "calamina galvanizada prepintada (ondulada o trapezoidal); en el departamento con aislación (lana de vidrio + cielo raso)"
  aguas:
    - id: techo_depto
      nombre: Departamento
      poly: [[4.40, 0.00], [16.90, 0.00], [16.90, 4.67], [4.40, 4.67]]
      cae_hacia: sur
      pendiente: 0.15
      cota_alta: 10.05
      cota_baja: 9.35
      estado: definido
      nota: "oculto detrás del antepecho en los cuatro lados; canaleta interior junto al antepecho sur, toda hacia el este (BP2), con rebosaderos (gárgolas) a la franja cada ~4 m por si se tapa"
    - id: techo_terraza
      nombre: Terraza
      poly: [[-1.125, 0.00], [4.40, 0.00], [4.40, 4.67], [-1.125, 4.67]]
      cae_hacia: oeste
      pendiente: 0.15
      cota_alta: 9.90
      cota_baja: 9.07
      estado: definido
      nota: "calamina sobre estructura de fierro a la vista (pedido del usuario), cae hacia el FRENTE: de la calle se ve un borde horizontal con su canaleta. Alto contra el muro del departamento (+9.90, debajo del antepecho +10.20, con babeta), ~2.45 libres en el borde del frente. Apoyos: postes metálicos sobre A1 y B1 y vigas hacia el muro del departamento (x=4.40); la esquina sur (y=4.67) en voladizo desde B1 o con un poste extra. Babeta contra el muro del departamento. Lo define el ingeniero"
  antepechos:
  # cota_base / cota_tope: de dónde a dónde sube cada antepecho (el muro del altillo llega a +9.60).
    - {de: [4.40, 0.00], a: [16.90, 0.00], cota_base: 9.60, cota_tope: 10.20, nota: "antepecho norte del departamento: tapa el borde alto"}
    - {de: [16.90, 0.00], a: [16.90, 4.67], cota_base: 9.60, cota_tope: 10.20, nota: "antepecho del fondo"}
    - {de: [4.40, 4.67], a: [16.90, 4.67], cota_base: 9.60, cota_tope: 10.20, nota: "antepecho sur del departamento: la canaleta va por dentro (nada sale a la franja de 2 m)"}
    - {de: [4.40, 0.00], a: [4.40, 4.67], cota_base: 9.60, cota_tope: 10.20, nota: "antepecho oeste del departamento: el techo de la terraza se apoya debajo"}
    - {de: [-1.125, 6.67], a: [16.90, 6.67], cota_base: 6.60, cota_tope: 8.40, nota: "muro ciego sur hacia el vecino, ~1.80 sobre la losa (ver muros.altillo)"}
  # Tanque elevado: base propia de hormigón sobre la columna A3 y el muro de la escalera, forrado de ladrillo.
  # Capacidad y altura SUPUESTAS (tanque de ~2500 L, ~1.55 de diámetro × 1.55 de alto): las define el plomero/ingeniero.
  tanque: {rect: [6.30, 0.00, 7.90, 1.60], cota_base: 10.20, alto: 1.80, capacidad: "~2500 L (supuesto)", estado: aproximado}
  postes:
    - {pos: [0.00, 0.00], nota: "sobre la columna A1"}
    - {pos: [0.00, 2.68], nota: "sobre la columna B1"}
  # Canaletas por dentro de la línea y=4.67 (no invaden la separación de 2 m), de chapa galvanizada, 0.5%.
  canaletas:
    - {de: [4.55, 4.58], a: [16.78, 4.58], pendiente: 0.005}
    - {de: [-1.18, 0.10], a: [-1.18, 4.58], pendiente: 0.005, nota: "canaleta vista al frente, colgada del borde del techo de la terraza (queda a ~1.05 de la fachada: dentro del voladizo frontal de 1.20)"}
  # Semisombra (malla raschel o toldo) sobre la lavandería: liviana y desmontable, a la altura del antepecho sur.
  semisombras:
    - {rect: [9.40, 4.67, 13.00, 6.67], nombre: "semisombra lavandería", nota: "malla semisombra o toldo retráctil sobre perfiles livianos, entre el muro del departamento y el muro ciego sur; desmontable (no es techo ni volado: confirmar con el arquitecto). El tendedero queda al sol"}
  # La terraza y la franja forman una franja continua de losa descubierta (y 4.67–6.67): punto alto al medio,
  # caída 1.5% hacia las dos esquinas sur, donde están los sumideros y las bajantes pluviales.
  pendientes_losa:
    - {de: [7.90, 6.05], a: [0.20, 6.05], texto: "losa 1.5%"}
    - {de: [7.90, 6.05], a: [15.60, 6.05], texto: "losa 1.5%"}
    - {de: [-0.55, 2.80], a: [-0.55, 4.40], texto: "piso 1%"}
  sumideros:
    - {pos: [-0.75, 6.40]}
    - {pos: [16.55, 6.40]}
  # Cada canaleta baja por un tubo pegado al antepecho hasta la bajante de la esquina (no se vuelca sobre la losa).
  conexiones:
    - [[-1.18, 4.58], [-1.18, 6.55], [-1.00, 6.55]]
    - [[16.78, 4.58], [16.78, 6.55]]
  bajantes:
    - {id: BP1, pos: [-1.00, 6.55], nota: "esquina sur del frente: canaleta del frente (techo de la terraza) + sumidero de la terraza; baja por la esquina del volado al acceso → a la calle (no al desagüe sanitario)"}
    - {id: BP2, pos: [16.78, 6.55], nota: "esquina sur del fondo (C5): techo del departamento + sumidero de la franja; baja al patio → jardín o calle (no al desagüe sanitario)"}

