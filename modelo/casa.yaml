  - "PB, ANTES DEL CONTRAPISO (interiorista 2026-10-05): rebaje de ~5–8 cm para la ducha del baño al ras del piso (con cancel); tubo eléctrico del muro sur de la cocina a la isla (enchufe de la isla); tubo del TD a la columna B2 (montante); desagüe de la bajante del Baño 2 (P1), que baja en el rincón noroeste del almacén (≈9.30, 3.85), hasta el colector del retiro norte (pasa bajo el pasillo y el estudio; registro accesible); desagües de lavadora, lavadero y lavadora manual; agua y desagüe del lavavajillas; agua fría para el dispensador del refrigerador."
