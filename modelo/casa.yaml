        - {pos: [7.20, 2.45], etiqueta: "LL baño"}
        - {pos: [16.75, 5.70], etiqueta: "LL cocina"}
        - {pos: [7.20, 6.30], etiqueta: "LL lavado"}
        - {pos: [-15.00, 6.62], gas: true, etiqueta: "LL general de gas (en el gabinete del medidor, pilar sur)"}
        - {pos: [15.20, 6.40], gas: true, etiqueta: "LL gas cocina"}
      rejillas:
        - {pos: [16.875, 3.00], etiqueta: "rejilla alta 2.20 (YPFB)", estado: propuesto, nota: "2026-10-07 (revisión del arquitecto, punto 5): antes en y 6.30, junto a la salida de la campana y a la entrada del gas; ahora sobre la rejilla baja (y 2.90), entre la columna B5 y el refrigerador, por encima del monitor del portero (1.45). Lejos de la campana: no vuelve a entrar el aire que sale"}
        - {pos: [16.875, 2.90], etiqueta: "rejilla baja 0.30 (YPFB)"}
      ventilaciones:
        - {pos: [7.25, 0.41], estado: propuesto, etiqueta: "V Ø50 baño y lavado → sube por el DUCTO de A3 (adentro) y sale por el techo junto al tanque"}
        - {pos: [16.70, 6.20], etiqueta: "V Ø50 cocina → sube por el muro este hasta sobre el techo"}
      # Materiales (usuario 2026-10-05): agua fría y caliente en PPR por termofusión (fría PN16–PN20; caliente PN20
      # mínimo, mejor PPR con fibra/compuesto; troncales 25 mm, ramales 20 mm; caliente aislada con coquilla).
      # Desagües en PVC sanitario (110 inodoros y bajantes, 50 el resto). Gas: material que define el gasista (YPFB).
      # Agua (corregido 2026-10-05: no hay pozo, era la cisterna): SEMAPA -> cisterna enterrada -> bomba -> tanque
      # elevado en el último piso -> baja por gravedad a toda la casa. Núcleo técnico en el muro norte, entre baño y
      # estudio (exterior, en el retiro): bajada de agua fría del tanque. El calefón está en el ALTILLO (2026-10-05).
      # SEMAPA + cisterna (2026-10-06, pedido del dueño): la cisterna VIEJA (esquina suroeste) se rehace DE CERO casi en el mismo
      # lugar, al lado de la puerta peatonal: se aprovecha su excavación, corriéndola ~0.5–1.0 al norte para alejarla del
      # cimiento del muro del Lote 103. Queda bajo el pasto y el camino (sin carga de auto).
      cisterna:
        pos: [-12.00, 6.05]
        rect: [-13.75, 5.35, -10.25, 6.75]
        tapa: [-12.00, 6.05]
        bomba: [-14.20, 6.35]
        va_bomba: 750
        etiqueta: "CISTERNA nueva ~5 m³ + bomba"
        estado: propuesto
        nota: "cisterna NUEVA enterrada de H°A° impermeabilizado (SEMAPA → cisterna → bomba → tanque elevado), BAJO EL CAMINO justo después de la puerta peatonal (usuario 2026-10-06: bajo piso y no bajo pasto, para que el riego no moje la tapa ni la losa). ALARGADA a lo largo del camino: ~1.00 × 3.10 por dentro con 1.60 de agua útil (~5 m³), ~1.40 × 3.50 por fuera, ~2.1 de hondo; capacidad según consumo y cortes de SEMAPA (plomero). TAPA de 0.60 hermética en el camino, con borde elevado, antideslizante. ATENCIÓN ESTRUCTURAL (revisión 2026-10-06): queda pegada al muro sur (Lote 103) y la cámara de la bomba a ~0.50 del muro de la calle. Se puede porque el muro sur es NUEVO y del dueño: se hace PRIMERO la cisterna, con paredes de H°A° que trabajen como muro de contención, y el muro sur y el de la calle se fundan con ella (lo diseña el ingeniero). ANTES: pozo de prueba para ver si el vecino tiene cimientos o construcción pegada al lindero; si los tiene, excavar por partes con entibado o volver a correrla al norte. La vieja se rellena o se demuele por partes. Si hay agua en el suelo, pestaña contra la flotación. BOMBA (~½–1 HP, ~11 m de altura + ~27 m de caño; la elige el plomero): centrífuga en CÁMARA SECA de ~0.80 × 0.80 pegada al OESTE de la cisterna, al SUR de la puerta peatonal (x -14.60 a -13.80, y 5.95 a 6.75; pedido del usuario), con tapa en el camino y drenaje; o sumergible. Circuito C20 con guardamotor, flotante en el tanque y protección contra marcha en seco. Medidor de SEMAPA en cajuela en la acera"
      # Impulsión: de la bomba (al sur de la puerta) por el borde norte del camino (y 5.20) hasta la vereda, al norte por la vereda (sin pasar bajo los autos) hasta
      # y -0.30 (a 0.25 del gas: ANH pide ≥0.20 en paralelo), y por el retiro norte hasta el núcleo técnico (x 9.25, antes de la ventana del estudio que empieza en 9.30), donde sube junto a la bajada del tanque. ~27 m.
      impulsion: [[-14.20, 6.35], [-14.20, 5.20], [-3.025, 5.20], [-3.025, -0.30], [7.25, -0.30], [7.25, 0.30]]   # 2026-10-08 plan B: entra bajo el muro norte y sube por el DUCTO de A3 (adentro)
      bajada_tanque: {pos: [7.25, 0.20], etiqueta: "AF ↓ tanque (ducto de A3)", nota: "2026-10-08 (plan B, propuesto): DUCTO de A3 por dentro, en el rincón noroeste del baño de PB, de los blancos del P1 y de la cocina del altillo: [7.125, 0.025, 7.325, 0.50]"}
      # Varias troncales: listas de polilíneas.
      agua_fria: [[[7.25, 0.20], [7.25, 3.10], [16.60, 3.10]]]
      # Agua caliente: baja del calefón del altillo por FUERA del muro norte junto a A2 (x 4.20, aislada y con cajón de
      # protección), entra bajo el piso y sigue la troncal de siempre por el hall y el pasillo.
      subida_caliente: {pos: [4.60, 0.10], etiqueta: "AC ↓ del calefón por el ducto de A2 (escalera)"}
      agua_caliente: [[[4.60, 0.10], [4.60, 3.35], [16.55, 3.35]]]
      # Desagüe: colector exterior por el retiro norte hacia la calle (frente); cámaras de inspección
      # en cambios de dirección y cada ~10-15 m. La cocina pasa antes por una desgrasadora.
      # 2026-10-07: colector alargado a x -4.00 (sigue hacia la calle por y -0.85, ver estado.md punto 3) para recibir la bajante
      # de la suite en la cámara CI2 (-4.00, -0.85): a 0.40 del gas enterrado (x -3.30 y y -0.55). En x -1.3 a -3.3 la cámara de
      # unión pisaba el gas (y -0.55). CI1 (-1.29, 5.85) = cámara de la bajante de la suite, bajo el acceso, CENTRADA EN EL EJE DE
      # LA PUERTA DE ENTRADA (revisores 2026-10-07): tapa RELLENABLE de 0.60 × 0.60, hermética, con la baldosa del acceso; se hace ANTES
      # del piso. El caño sigue al oeste por y 5.85: a 0.65 de la impulsión (y 5.20), a 0.85 del cable (y 5.00) y a 0.35 de la cámara
      # de la puesta a tierra; cruza el gas (x -3.30) en perpendicular.
      colector: [[17.70, 5.15], [17.70, -0.85], [-4.00, -0.85]]
      camaras: [[17.70, -0.85], [12.70, -0.85], [10.93, -0.85], [8.00, -0.85], [2.00, -0.85], [-1.29, 5.85], [-4.00, -0.85]]
      # Desagüe PLUVIAL (no va nunca al colector sanitario). 2026-10-07 (PROPUESTO, revisión del arquitecto punto 4).
      pluvial:
        - linea: [[-1.36, 6.645], [-1.36, 6.70], [-2.00, 6.70], [-2.00, 4.00], [-5.00, 4.00]]
          etiqueta: "← BP1 Ø100 enterrado, 1 %"
          estado: propuesto
          nota: "de la base del cajón (tapón de registro al pie, a ~0.30 del suelo) sale al oeste pegado al muro sur (0.20 al sur de la cámara de la puesta a tierra), dobla al norte en x -2.00 (0.25 al este de esa cámara) bajo el camino y el deck, y al oeste por y 4.00 bajo la vereda hasta el POZO DE ABSORCIÓN. Cruza en perpendicular, por encima, el desagüe de la suite (y 5.85), el cable del portero (y 5.00), la canilla de la terraza (y 4.60), la impulsión (x -3.025) y el gas (x -3.30), a ≥0.20. ~7.2 m"
        - rect: [-6.00, 3.50, -5.00, 4.50]
          etiqueta: "POZO DE ABSORCIÓN de BP1 (~1.0 × 1.0 × 1.2, grava)"
          estado: propuesto
          nota: "x -6.0 a -5.0, y 3.5 a 4.5: a ~2.4 del borde de la terraza, ~4.9 de la casa, ~4.2 de la cisterna y 0.5 del cable del borde del camino. Si el suelo no absorbe (prueba de infiltración), un caño de REBALSE a la calle por su cuenta, junto al colector; nunca al desagüe sanitario. PRUEBA DE INFILTRACIÓN antes de hacerlo"
      desgrasadora: [17.70, 5.15]
      # Gas natural (red), 2026-10-06 (usuario): el medidor está en el PILAR SUR, pegado al Lote 103 (ahí llega la red).
      # A LA VISTA por la cara interior del MURO SUR a ~0.15 (con ángulo o canaleta de protección: es el borde del camino),
      # ENTERRADO desde x -3.30 cruzando la vereda y el fondo del estacionamiento (funda PVC clase 9) hasta y -0.55 y al este
      # hasta pasar la columna A1, y otra vez A LA VISTA por la fachada norte de la casa a ~2.40 (sobre dinteles y la puerta
      # del depósito, bajo la losa) y la fachada este hasta la cocina; subida al calefón junto a A2. Norma ANH (RAN-ANH-UN
      # 0036/2016, anexo 5): a la vista con abrazaderas y protección donde hay golpes, nunca encima de muros; enterrado a
      # ≥0.30 (acero protegido) o ≥0.60 (multicapa), cinta amarilla, nunca bajo cimientos; ≥0.20 de agua y cables enterrados.
      # 2026-10-08 (PROPUESTO, revisión del arquitecto puntos 7 y 24, opción 2): YA NO va a la vista por las fachadas norte y
      # este. ENTERRADO por el retiro norte en y -1.45 (al norte de las cámaras del colector, ≥0.20; a 0.30 del caño de la
      # canilla en y -1.75; cruza el colector en x -3.30 en perpendicular, por encima) y por el patio en x 18.30 (≥0.60 del
      # colector y la desgrasadora). Sale del suelo SOLO en la esquina C5, a ~0.60 (cocina). Plan B (2026-10-08): el ramal del calefón sale del muro sur
      # (x -3.30) a la vista hasta el cajón gris de la esquina suroeste (gas_ramales).
      # Antes: [-3.30, -0.55] → [0.30, -0.55] → a la vista a ~2.40 por y -0.17 hasta x 17.07 y por la fachada este.
      gas: [[-15.00, 6.62], [-3.30, 6.62], [-3.30, -1.45], [18.30, -1.45], [18.30, 6.45], [16.90, 6.45], [14.78, 6.45]]
      # 2026-10-07 (revisión del arquitecto, punto 5): por la fachada este baja de ~2.40 a ~0.60 en y 6.45 y ENTRA BAJO, detrás
      # del mesón sur, hasta las hornallas; nunca dentro del cajón de la campana. ≥0.30 de la toma del rincón (y 6.20, a 1.10)
      # y separado de la ventilación de la cocina (16.70, 6.20). Lo aprueba el gasista (YPFB).
      gas_ramales:
        - {linea: [[-3.30, 6.62], [-1.60, 6.62], [-1.60, 6.435], [-1.425, 6.435]], etiqueta: "GN al calefón: a la vista por el muro sur → sube en el compartimiento propio del cajón gris", estado: propuesto}
    # Ventilación mecánica (aprobada 2026-10-03). Solo lo que no tiene ventana propia: campana de la
    # cocina y extractor del lavado. Baño, estudio, comedor y cocina ya ventilan por ventana; el almacén
    # por su banderola. La losa ya está hecha: los ductos van BAJO la losa y BAJO las vigas (nunca
    # perforar vigas ni losa) y salen por muros de ladrillo. Nunca hacia el vecino (muro sur).
    ventilacion:
      ductos:
        - id: campana
          linea: [[14.78, 6.35], [16.90, 6.35], [17.10, 6.35]]
          diametro: 150
          estado: definido
          nota: "campana → patio, 2.1 m recto, escondido en un cajón sobre las alacenas altas del muro sur. 2026-10-07 (revisión del arquitecto, punto 5): salida al patio LO MÁS ALTA posible (~2.75, bajo la viga: confirmar cuánto cuelga) con SOMBRERETE que tire el aire hacia abajo y hacia afuera; ya no comparte el rincón con la rejilla alta ni con el gas. Queda ~1.6 m debajo y 0.20 al sur de la ventana del Cuarto 2: la hoja SUR de esa ventana va FIJA"
        - id: lavado
          linea: [[8.10, 6.00], [7.45, 6.00], [7.45, -0.20]]
          diametro: 100
          extractor: true
          estado: definido
          nota: "extractor del lavado → retiro norte, por el cielo falso del lavado, el pasillo y el baño (~7 m)"
      cielos_falsos:
        - {rect: [7.05, 3.73, 9.125, 6.67], alto: 2.70, nota: "lavado completo"}
        - {rect: [7.05, 2.68, 7.65, 3.73], alto: 2.70, nota: "franja de 0.60 en el arranque del pasillo"}
        - {rect: [7.05, 0.00, 8.85, 2.68], alto: 2.70, nota: "baño completo (oculta el ducto)"}
      cajones:
        - {rect: [14.30, 6.10, 16.90, 6.67], nota: "cajón sobre las alacenas altas (campana)"}
        - {rect: [7.075, 0.025, 7.325, 0.50], ducto: true, estado: propuesto, nota: "DUCTO de A3 (plan B 2026-10-08): agua fría del tanque, impulsión y ventilación Ø50; ladrillo de 6 huecos revocado, de piso a techo; pases entre viguetas en x ~7.25, y 0.20–0.41"}
        - {rect: [10.75, 0.025, 11.325, 0.45], ducto: true, estado: propuesto, nota: "DUCTO de la bajante común en el estudio: envuelve la cara sur de A4 (se lee como la columna más ancha); tapa de registro abajo"}
        - {rect: [4.525, 0.025, 4.675, 0.30], ducto: true, estado: propuesto, nota: "DUCTO de A2 en el rincón de la escalera (plan B 2026-10-08): agua caliente del calefón; del depósito de PB, cruzando los dos descansos, hasta el altillo, donde pasa a la terraza por el muro x 4.40"}

