# Instalaciones (ESQUEMA PRELIMINAR para conversar con el ingeniero/instalador; no es un proyecto
# aprobable). Lo puntual (luces, enchufes, puntos de agua y desagüe) se genera desde ambientes y
# muebles en tools/instalaciones.py; aquí solo van los elementos fijos y los recorridos troncales.
instalaciones:
  pb:
    electrico:
      tablero: {pos: [2.75, 6.45], nota: "TD en el hall, junto al ingreso"}
      # Montante: tubos dejados en la losa por los albañiles, al lado sur de la columna B2 (dicho por el usuario 2026-10-04): por ahí suben los cables a los pisos de arriba. En PB no hay camino definido: se propone
      # bajar del TD al contrapiso (el piso aún no está hecho), ir por debajo del piso y subir por el muro x=4.40 (lado living).
      montante: {pos: [4.40, 2.88], etiqueta: "montante ↑ P1 y altillo (B2)"}
      alimentador: [[2.75, 6.45], [4.28, 6.45], [4.28, 2.88], [4.40, 2.88]]
      acometida: {pos: [-0.30, 6.10], nota: "desde el medidor en el muro de la calle (frente del lote)"}
      timbre: [-0.20, 6.45]
      luces_extra:
        - {pos: [14.20, 4.40], nota: "colgantes sobre la isla"}
        - {pos: [16.45, 5.15], nota: "bajo alacena / sobre lavaplatos"}
    sanitario:
      # Agua: pozo en el patio + bomba -> tanque elevado en el último piso -> baja por gravedad a toda
      # la casa (decisión del usuario 2026-10-03). Núcleo técnico en el muro norte, entre baño y
      # estudio (exterior, en el retiro): bajada de agua fría del tanque + calefón a gas natural.
      pozo: {pos: [21.20, 3.00], nota: "pozo con bomba; distancias a desagües a confirmar con el instalador"}
      impulsion: [[21.20, 3.00], [17.15, 3.00], [17.15, 0.10]]   # del pozo a la subida al tanque (esquina NE)
      bajada_tanque: {pos: [9.10, -0.30], nota: "bajada de agua fría desde el tanque elevado (muro norte)"}
      # Varias troncales: listas de polilíneas.
      agua_fria: [[[9.10, -0.30], [9.10, 3.10], [16.60, 3.10]], [[9.10, 3.10], [7.20, 3.10]]]
      agua_caliente: [[[8.80, -0.30], [8.80, 3.35], [16.55, 3.35]], [[8.80, 3.35], [7.40, 3.35]]]
      calefon: {pos: [8.80, -0.30], nota: "calefón a gas natural, exterior en el muro norte (retiro), en nicho; centro de los consumos de agua caliente"}
      # Desagüe: colector exterior por el retiro norte hacia la calle (frente); cámaras de inspección
      # en cambios de dirección y cada ~10-15 m. La cocina pasa antes por una desgrasadora.
      colector: [[17.70, 5.15], [17.70, -0.85], [-3.00, -0.85]]
      camaras: [[17.70, -0.85], [12.70, -0.85], [8.00, -0.85], [2.00, -0.85]]
      desgrasadora: [17.70, 5.15]
      # Gas natural (red): desde el medidor en el frente, por el retiro norte (exterior, nunca bajo
      # la losa), al calefón y a la cocina por detrás del mesón del muro sur.
      gas: [[-0.40, -0.55], [17.25, -0.55], [17.25, 6.30], [16.90, 6.30], [14.78, 6.30]]
    # Ventilación mecánica (aprobada 2026-10-03). Solo lo que no tiene ventana propia: campana de la
    # cocina y extractor del lavado. Baño, estudio, comedor y cocina ya ventilan por ventana; el almacén
    # por su banderola. La losa ya está hecha: los ductos van BAJO la losa y BAJO las vigas (nunca
    # perforar vigas ni losa) y salen por muros de ladrillo. Nunca hacia el vecino (muro sur).
    ventilacion:
      ductos:
        - id: campana
          linea: [[14.78, 6.35], [16.90, 6.35], [17.10, 6.35]]
          diametro: 150
          estado: definido
          nota: "campana → patio, 2.1 m recto, escondido en un cajón sobre las alacenas altas del muro sur"
        - id: lavado
          linea: [[8.10, 6.00], [7.32, 6.00], [7.32, -0.20]]
          diametro: 100
          extractor: true
          estado: definido
          nota: "extractor del lavado → retiro norte, por el cielo falso del lavado, el pasillo y el baño (~7 m)"
      cielos_falsos:
        - {rect: [7.05, 3.73, 9.125, 6.67], alto: 2.70, nota: "lavado completo"}
        - {rect: [7.05, 2.68, 7.65, 3.73], alto: 2.70, nota: "franja de 0.60 en el arranque del pasillo"}
        - {rect: [7.05, 0.00, 8.85, 2.68], alto: 2.70, nota: "baño completo (oculta el ducto)"}
      cajones:
        - {rect: [14.30, 6.10, 16.90, 6.67], nota: "cajón sobre las alacenas altas (campana)"}

  p1:
    electrico:
      montante: {pos: [4.40, 2.88], etiqueta: "montante ↕ (B2)"}
      alimentador: [[4.40, 2.88], [4.52, 3.12]]
      tablero: {pos: [4.52, 3.12], nota: "subtablero del primer piso junto a la columna B2 (corrido hacia la puerta del dormitorio: no al pie de la grada al altillo), lado del hall (muro x=4.40 entre B2 y la puerta del dormitorio): los tubos salen por la cara sur de B2, dentro de ese mismo muro (dicho por el usuario 2026-10-04); alimentado desde el TD de PB (tubos por dentro de B2 en las dos losas)"}
    sanitario:
      # Agua fría baja del tanque elevado por el núcleo técnico (muro norte); el agua caliente sube desde el
      # calefón de PB por el mismo lugar. Troncales por los blancos y el pasillo hacia los baños de los hijos y,
      # por el hall y el vestidor, hacia la suite principal (solo agua fría: la caliente sale del termotanque).
      bajada_tanque: {pos: [9.10, -0.30], etiqueta: "AF ↓ tanque"}
      subida_caliente: {pos: [8.80, -0.30], etiqueta: "AC ↑ calefón (PB)"}
      agua_fria: [[[9.10, -0.30], [9.10, 0.10], [9.30, 0.10], [9.30, 3.20], [11.35, 3.20]], [[9.30, 3.20], [6.50, 3.20], [6.50, 4.10], [5.70, 4.10], [5.70, 5.90], [-0.20, 5.90]]]
      agua_caliente: [[[8.80, -0.30], [8.80, 0.20], [9.20, 0.20], [9.20, 3.45], [11.35, 3.45]], [[3.73, 5.77], [3.73, 5.65], [-0.20, 5.65]]]
      # La suite principal tiene su propio termotanque eléctrico (decisión del usuario 2026-10-03): agua caliente corta.
      termotanque: {pos: [3.73, 5.77], nota: "termotanque eléctrico 50–80 L en la esquina del vestidor, junto a los lavamanos; circuito propio C12"}
      # Sin colector en este piso: cada artefacto va a su bajante (BV).
      bajantes:
        - {pos: [9.25, -0.70], ambientes: [bano_hijo_1], etiqueta: "Baño 1, por fuera (x ≤ 9.25)"}
        - {pos: [9.30, 3.85], ambientes: [bano_hijo_2], etiqueta: "Baño 2 → ducto en esquina (almacén abajo)"}
        - {pos: [-0.30, 6.50], ambientes: [wc_ppal, ducha_ppal, lavamanos_ppal], etiqueta: "suite → esquina C1, baja por fuera"}
    ventilacion:
      ductos:
        - id: baño 2
          linea: [[10.85, 6.10], [10.85, -0.20]]
          diametro: 100
          extractor: true
          estado: definido
