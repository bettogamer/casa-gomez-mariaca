        # del hall. Borde norte del camino (y 5.00, junto al cable del medidor, a ≥0.20); entra bajo el umbral de la puerta;
        # contrapiso a 0.45 del muro sur por el ingreso y el hall (lejos del TD y su alimentador, y 6.45) y sube por el muro sur
        # entre C2 y C3 hasta el monitor (x 4.86).
      seguridad:
        porton: {pos: [-13.60, 1.55], etiqueta: "← motor del portón (C22)", estado: propuesto, nota: "motor del portón corredizo de 3.20 junto al pilar norte, por dentro; PANEL DEL PORTERO en el pilar sur de la puerta peatonal (~[-15.15, 6.60]) con apertura eléctrica de la puerta; tubos enterrados por el camino hasta la casa; el monitor está en el hall, al pie de la grada (2026-10-12)"}
        # Monitor del portero en el HALL, al pie de la grada (pedido del dueño 2026-10-12; antes en la cocina).
        # `panel` = [x, y] del monitor A PROPÓSITO: el generador une panel y monitor con una recta que cruzaría la casa;
        # el panel real está en el pilar norte de la puerta peatonal (punto PT del camino) y el recorrido va en `debiles`.
        portero: {pos: [4.86, 6.62], panel: [-15.225, 5.15], recorrido: [[-15.225, 5.15], [-15.00, 5.00], [-0.50, 5.00], [-0.50, 5.50], [0.40, 5.50], [0.40, 6.20], [4.86, 6.20], [4.86, 6.62]], nota: "MONITOR del portero en el HALL, muro sur (eje C) entre las columnas C2 y C3, en el tramo libre de ~0.67 entre la cara de C2 (x 4.525) y el closet de abrigos (x 5.20), centrado en x 4.86, a 1.45 del piso: queda de frente al bajar la grada y a la vista desde el hall y el ingreso (2026-10-12, pedido del dueño; antes en la cocina, muro este). ~0.24 de muro libre a cada lado. Fuente: caja de 220 V del C23 (con respaldo) detrás del monitor, o fuente en riel en el TD si el equipo es de 2 hilos. Abre solo la puerta peatonal (el portón con su control remoto). Panel en el pilar norte de la puerta peatonal", estado: propuesto}
        camaras:
          - {pos: [-0.25, 4.85], nota: "frente: acceso y terraza. Mirando al OESTE-SUROESTE (hacia la puerta peatonal y el camino), con lente gran angular. 2026-10-07 (interiorista): el cajón gris de las bajantes (x -1.425 a -1.125, y 6.495 a 6.795) queda en el borde sur del cuadro y no tapa la puerta de entrada ni el camino; detrás de él solo queda ciego un rincón de ~0.20 × 0.30 contra el muro sur", estado: propuesto}
