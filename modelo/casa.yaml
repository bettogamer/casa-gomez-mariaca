verificar_en_obra:
  - "NIVELES DE PB (punto 10, 2026-10-08): con manguera de nivel, medir cuánto más alto que la VEREDA PÚBLICA está la losa o contrapiso de PB, la tierra del PATIO de atrás y la del RETIRO norte. Las cotas de `niveles_piso` son propuestas sobre un piso terminado a +0.20; si lo medido cambia, se corren todas juntas"
  - "Comprobar que lo construido siguió IMG_8278: tramo del fondo 5.70 m (el PDF decía 4.50 m)."
  - "Sección real de columnas (se asume 25x25) y espesor de losas."
  - "Distancia de la casa al lindero del fondo (5.00 m) y al lateral del Lote 105 (2.01 m)."
  - "Volado de la losa del primer piso al frente: medir cuánto sale (se asume 1.00 m desde la cara del muro) y su espesor en la punta. El baño principal y la logia van encima."
  - "Cuánto cuelga la viga del eje A entre A2 y A3 bajo la losa del altillo (define el alto de la ventana de la escalera)."
  - "CAJÓN DE BAJANTES de la esquina suroeste (PROPUESTO 2026-10-07, revisión del arquitecto punto 4, aceptado por el dueño; reemplaza la bajante junto a la puerta de entrada). MEDIR el CANTO REAL del volado del primer piso y de la losa del altillo en esa esquina: el muro del frente de la caja va con la cara exterior al ras del canto (se supone x -1.125) y el cajón de chapa (x -1.425 a -1.125) pegado al canto en los tres niveles, sin ranura; si el canto está en otro lugar, se corren los dos."
  - "INGENIERO (punto 4, 2026-10-07): PESO NUEVO en la punta del volado, ~500 kg (muro técnico con estanque empotrado, poyo de la ducha y contrapiso de ~10–12 cm bajo el plato): el muro técnico y el poyo HUECOS o con relleno liviano y el contrapiso LIVIANO. Anclajes del bastidor del cajón SOLO a hormigón macizo (punta de la viga del eje C en volado a +3.40 y +6.60, columna C1 o encadenado), nunca a viguetas, plastoformo ni ladrillo de 6 huecos."
  - "INGENIERO (punto 4): ¿qué hay en el CANTO del volado entre B y C (y entre A y B) para colgar la canaleta-cornisa de la logia? Si no hay viga de borde vaciada, ménsulas al muro del frente o a la carpeta; nada atornillado al plastoformo."
  - "INGENIERO (punto 4): profundidad de las ZAPATAS de C1 y B1 y del CIMIENTO DEL MURO SUR. Ninguna zanja (desagüe de la suite, pluvial, cámara CI1, dado del cajón) por debajo de ellas. Dado del cajón de 0.40 × 0.30 que no pase de y 6.795, separado con junta del cimiento del muro sur; antes, POZO DE PRUEBA junto al lindero."
  - "PLOMERO (punto 4): PRUEBA DE INFILTRACIÓN del pozo de absorción de BP1 (jardín, x -6.0 a -5.0, y 3.5 a 4.5) y REBALSE propio a la calle (nunca al desagüe sanitario). Cámara CI1 (-1.29, 5.85) con tapa rellenable hermética de 0.60 × 0.60, hecha ANTES del piso del acceso. Inodoro colgado con estanque empotrado (muro técnico de 0.15–0.20), sifón de perfil bajo en la ducha, pendientes del 2 %, ventilación con sombrerete sobre el cajón."
  - "NORMATIVA (punto 4): el cajón de bajantes queda ~1.40 delante de la fachada de planta baja (x 0), dentro del retiro frontal, y la canaleta-cornisa sale 0.10 del canto del volado (voladizo desde la cara del muro de PB ~1.10; límite 1.20). Lo confirma el arquitecto de la obra."
  - "¿Hay viga en el eje 1 (A1–B1 y B1–C1) y cuánto cuelga? (define el dintel de la puerta de entrada y de la ranura del living, las dos a 2.60)"
  - "¿Hay viga en el eje A entre A1 y A2 a +3.40 y cuánto cuelga? (dintel de la ventana del living de 3.00)"
  - "Puerta peatonal y medidor de gas ACTUALES (fotos IMG_8373 e IMG_8376): medir el ancho de la puerta actual, la distancia de su borde sur al muro del vecino (Lote 103) y el tamaño y la altura del gabinete del medidor de gas. El modelo supone un pilar de 0.585; la foto sugiere ~1.3–1.5. ¿La puerta y el muro actuales se quedan o se rehacen? El medidor de gas NO se mueve sin YPFB."
  - "Losa del altillo, hueco de la escalera (foto IMG_8391, 2026-10-06, desde arriba mirando al norte): coincide con el modelo: hueco de A2–A3 a B2–B3 más la muesca sobre el tramo de 10 del lado del eje 3 (pasa el eje B), con losa entre B2 y esa muesca; bordes con encofrado todavía puesto; abajo se ve el descanso P1→altillo contra el muro norte. Se ven FIERROS DE ESPERA arriba de las columnas A2 y A3 (sirven para prolongarlas en el altillo). Medir: largo de la muesca más allá del eje B (el modelo supone 1.17, hasta y 3.85) y su ancho (supone 1.325, desde x 5.725); ¿hay fierros de espera en las demás columnas a prolongar (A4, A5, B2–B5)?"
  - "Escalera, muro norte (foto IMG_8388): medir el ALTO de la viga del eje A entre A2 y A3 (cuánto cuelga bajo la losa del P1 y, si es igual, bajo la del altillo). Define el borde de arriba de la ventana de la escalera (hoy a 2.90 sobre el piso del P1) y la altura del muro bajo la viga."
  - "Cisterna vieja (esquina suroeste del lote): se rehace DE CERO casi en el mismo lugar (usuario 2026-10-06). Ubicarla y medirla, vaciarla y aprovechar su excavación para la nueva (casi en el mismo lugar, corrida al norte: ver instalaciones.pb.sanitario.cisterna). Ubicar el medidor de SEMAPA actual y la cañería de entrada. Foto IMG_8376: la boca de la cisterna vieja (marco de madera, al ras) y la casita de la bomba (techito de calamina) están pegadas al pilar sur de la puerta, por dentro: medir la boca, su distancia a la puerta y al muro del vecino, y la profundidad."
  - "EXTERIORES DEL FRENTE (propuesto 2026-10-06): medir el ancho libre real entre los muros de los vecinos en el jardín delantero (el modelo supone 8.93: y -2.135 a 6.795) y la distancia de la casa a la línea de la calle (12.60 desde la terraza). ¿Existen muros laterales en el frente (Lote 105 y Lote 103)? ¿De quién son, qué altura tienen, dónde está el cimiento del muro del Lote 103 junto a la cisterna? Para los gatos tienen que ser igual de altos que el de la calle y con corona anti-gatos. Niveles: acera (cota cero, OM 4100/10 art. 41), piso del portón y del estacionamiento, camino, acceso (±0.00) y terraza con deck."
  - "Muro de la calle, portón y puerta peatonal (propuesto 2026-10-06, revisado el mismo día): el USUARIO da por buenos el muro ciego (lo vio en muchas casas de la zona), la cisterna en el retiro frontal y la acera SIN árbol; igual el ARQUITECTO lo confirma al presentar el plano (altura del cerco: la OM 4100/10 no lo dice; art. 49 cisterna; art. 53 b pide indicar especie de árbol en faja jardín y acera; art. 48 a vs 49 parqueo en el retiro) y tramita el rebaje del cordón. El INGENIERO: cimiento excéntrico, columnetas y encadenados del muro de 2.50 (viento); viga del riel con paso de autos, columna del pilar norte y anclajes de la guía superior; pilares de los medidores más gruesos; cisterna BAJO EL CAMINO pegada al muro sur nuevo (2026-10-06: pozo de prueba del lado del Lote 103; cisterna primero y muros fundados con ella; contención, flotación y cómo tratar la vieja); protección del colector y las cámaras bajo los autos; zanjas junto a las zapatas de A1–A4; que no se apoye nada en los muros vecinos. El HERRERO: hoja de ~3.45 guardada detrás de 3.45 m de muro (¿alcanza para tope y cierre?; si no, sumar 0.10–0.20 sin tocar el pilar del gas) y corona solo hacia afuera en el tramo de guardado. Si el corredizo da mucho lío, el usuario acepta un portón ABATIBLE (pero barre el auto de afuera: habría que correrlo ~1.70 hacia adentro). El GASISTA (YPFB): recorrido enterrado del gas por el camino y la vereda (RAN-ANH-UN 0036/2016, anexo 5) y separación entre el gabinete de gas y el de luz (ANH 42.4: ≥0.30 de instalaciones eléctricas)."
  - "Frente — medir antes de construir (revisores 2026-10-06): PROBAR LA ENTRADA DE RETRO con los dos autos por un hueco de 3.20 marcado con estacas o cinta, con la calle como está; ancho real de la calzada y de la acera y sentido del tránsito; ancho libre entre muros vecinos (se supone 8.93); muros laterales del frente (dueño, alto, espesor, columnas, y POZO DE PRUEBA junto al cimiento del Lote 103 frente a la cisterna); cisterna vieja (posición, medidas, profundidad, material, ¿agua o humedad por fuera?, rellenos); ¿hay muro o cimiento en la línea de la calle?; niveles de acera, portón, estacionamiento, camino, acceso y deck (si algún muro contiene tierra); profundidad de la conexión de alcantarillado de SEMAPA en la calle (¿el colector de ~39 m llega por gravedad?); tamaño de los gabinetes de YPFB y ELFEC; nivel de la zapata de A1 y de la viga de fundación del eje A."
  - "Instalaciones (ronda de huecos 2026-10-05): el electricista calcula la DEMANDA (~37 kVA instalados: horno, anafe, lavavajillas, bomba) y define con ELFEC si la acometida es monofásica de mayor amperaje o trifásica; protector contra sobretensiones en el TD; medir la resistencia de la puesta a tierra. El plomero confirma ventilaciones de desagüe sobre el techo, rebalse y limpieza del tanque, flotante de la bomba. YPFB: rejillas de la cocina y llaves de corte"
  - "Logia de la suite (P1): muro bajo de 1.00 + celosía de madera en el costado norte, en la punta del volado: el ingeniero confirma el peso y el anclaje de la celosía a la losa del altillo; el arquitecto, que con celosía no hay vista directa al Lote 105 (logia a 2.01 del lindero)"
  - "Tanque elevado: base subida a +10.50 (~2.5 m sobre la entrada del calefón del altillo). Base propia de hormigón sobre A3 y el muro de la escalera, aún no construida: el ingeniero la dimensiona con la nueva altura (más palanca con viento y sismo)"
