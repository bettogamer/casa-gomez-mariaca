  - "Hall del P1: borde real del hueco de la losa del altillo sobre el hall (define si la luz del hall es plafón o aplique a 2.20). Contrapiso de los baños del P1: que dé la pendiente para el inodoro del Baño 1 (~1 m hasta la bajante) y el lavamanos del Baño 2 (~3 m) sin tocar viguetas"
