# Modelo de la casa — fuente de verdad del proyecto.
#
# Todo lo que se dibuja (plantas SVG, visor 3D, DXF, reporte) se genera desde
# este archivo con `make build`. Para modificar la casa se edita AQUÍ, nunca
# los archivos de `salida/`.
#
# Sistema de coordenadas (metros):
#   x = a lo largo de la casa, 0 en el eje 1 (lado terraza / calle), crece hacia el fondo.
#   y = a lo ancho, 0 en el eje A (lado Lote 105), crece hacia el Lote 103.
#   Ambos ejes se miden a CENTRO de columna. La pared exterior queda ~0.125 m afuera.
#
# Leyenda de `estado` en cada elemento:
#   construido   -> ya existe en obra. NO se modifica sin verificarlo con cinta métrica.
#   aproximado   -> digitalizado de foto; medidas a ±10-20 cm. Confirmar.
#   propuesto    -> modificación nuestra, todavía no aprobada.
#   pendiente    -> falta información.

proyecto:
  nombre: Vivienda unifamiliar
  ubicacion: Cochabamba — Subalcaldía Alejo Calatayud, Distrito 5, Zona Lacma, Mz 101, Lote 4
  codigo_catastral: 05-17-101-063-0-00-000-000
  calle: Pasaje innominado / Calle Víctor Rodrigo (9.00 m)
  fuente_base: >
    Fotos del juego impreso (planos-arqui/IMG_8276..8278, ago-2026). NO coincide
    con el PDF "PLANO DE const. 06-03.pdf" (versión anterior, feb-2020). Ver
    docs/versiones-del-plano.md.

lote:
  largo: 37.25          # P1-P2 (colinda Lote 105, Jesús Maldonado)
  ancho: 9.02           # P1-P4 (frente a la calle)
  # Posición del lote en coordenadas de la casa (esquina P1 = arriba-izquierda).
  origen_x: -15.225     # = fondo(22.025) - 37.25
  origen_y: -2.135      # retiro lateral 2.01 m + media pared
  retiro_fondo: 5.00    # de la pared del fondo al lindero P2-P3
  colindantes:
    arriba: Lote 105 — Jesús Maldonado
    abajo: Lote 103 — Germán Sánchez
    fondo: Lote 95 — Rubén Pérez
    frente: Calle Víctor Rodrigo

# Alturas: el usuario cambió en obra a 3.00 m LIBRES (piso a techo), no 3.00 piso a piso
# como decía el plano. Piso a piso = 3.00 + espesor de losa (0.20 supuesto) = 3.20.
# Las cotas cambian si se mide otro espesor de losa.
niveles:
  - id: pb
    nombre: Planta baja
    cota: 0.20          # nivel de piso terminado (según plano)
    altura_libre: 3.00  # piso a techo — confirmado por el usuario
    altura: 3.20        # piso a piso = libre + losa
  - id: p1
    nombre: Primer piso
    cota: 3.40
    altura_libre: 3.00
    altura: 3.20
  - id: altillo
    nombre: Altillo
    cota: 6.60
    altura_libre: 3.00  # altillo aún sin techo construido; altura por definir
    altura: 3.20

estructura:
  estado: construido
  nota: Columnas, losas y escalera YA construidas. Son la restricción principal del diseño.
  seccion_columna: 0.25 # 25x25 estimado por el usuario (sin medición)
  espesor_losa: 0.20    # supuesto; medir en obra
  # Losas construidas (2026-10-03): piso del primer piso (+3.40) y piso del altillo (+6.60),
  # recién terminada. El altillo NO tiene techo todavía; columnas llegan hasta +6.60.
  losas_construidas: [p1, altillo]
  espesor_muro_ext: 0.25
  espesor_muro_int: 0.15
  # Ejes según planos-arqui/IMG_8278.png: plano con el que se construyeron las columnas
  # (confirmado por el usuario 2026-10-03). IMG_8278 copy.png = misma foto + línea roja B4-B5
  # que solo indica la distancia de ese tramo (no es viga ni muro).
  ejes_x: {"1": 0.00, "2": 4.40, "3": 7.05, "4": 11.20, "5": 16.90}
  ejes_y: {A: 0.00, B: 2.68, C: 6.67}
  # Columnas = intersecciones de ejes, salvo las listadas en `desplazadas`.
  columnas_en: [A1, A2, A3, A4, A5, B1, B2, B3, B4, B5, C1, C2, C3, C4, C5]
  # La cota 4.10 entre 1' y 2' en IMG_8278 es error de dibujo: C1-C2 = 4.40 (comprobado con la
  # planta 1º piso IMG_8277, dormitorio de 4.35 entre columnas). Ninguna columna desplazada.
  desplazadas: {}
  escalera:
    estado: construido
    tipo: U (dos tramos con descanso junto a la pared del lado Lote 105)
    foto_obra: planos-arqui/IMG_8371.HEIC   # foto de obra, 2026-10-03
    # Caja entre los ejes 2 y 3. Se arranca del lado del eje 2 (living, junto a la columna B2),
    # se sube hacia el eje A, descanso, y se vuelve por el lado del eje 3 (comedor).
    # Confirmado por el usuario 2026-10-03.
    huella: 0.28                     # confirmado por el usuario
    contrahuella: 0.188              # 3.20 / 17 (el descanso cuenta como un escalón)
    ancho_tramo: 1.20                # según plano; NO medido
    descanso_fondo: 1.20             # según plano; NO medido -> define cuánto sobresale el 1er tramo
    pisos:
      - {desde: pb, hasta: p1, tramos: [{lado: "2", escalones: 10}, {lado: "3", escalones: 6}]}
      # Invertida para no quitar el pasaje central del primer piso; el tramo de 10 sobresale en el altillo.
      - {desde: p1, hasta: altillo, tramos: [{lado: "2", escalones: 6}, {lado: "3", escalones: 10}]}

# ─────────────────────────────────────────────────────────────────────────────
# DISEÑO NUEVO (2026-10-03 en adelante). Se define pieza por pieza con el usuario.
# Lo que no está aquí todavía se dibuja en gris desde `referencia`.
#
# Ambientes: `rect: [x0, y0, x1, y1]` o `poly: [[x,y], ...]`, a eje de muro.
#   tipo: social | dormitorio | bano | cocina | servicio | circulacion | exterior
#   estado: definido (acordado con el usuario) | propuesto | aproximado
# Los bordes de los ambientes son muros de ladrillo, salvo donde `muros` o `aberturas`
# dicen otra cosa (celosía, puerta, ventana, paso abierto).
# ─────────────────────────────────────────────────────────────────────────────
ambientes:
  pb:
    - {id: terraza, nombre: Terraza libre, tipo: exterior, rect: [-2.625, -0.125, -0.125, 4.95], estado: definido}
    - {id: acceso, nombre: Acceso, tipo: exterior, rect: [-2.625, 4.95, -0.125, 6.795], estado: definido, nota: "nivel ±0.00, llega a la puerta de entrada"}
    - {id: living, nombre: Living, tipo: social, rect: [0.00, 0.00, 4.40, 4.95], estado: definido}
    - {id: ingreso, nombre: Ingreso, tipo: circulacion, rect: [0.00, 4.95, 2.58, 6.67], estado: definido}
    - id: deposito_patio
      nombre: Depósito patio
      tipo: servicio
      rect: [4.40, 0.00, 7.05, 2.68]      # entre columnas A2-A3-B2-B3, debajo de la escalera
      estado: definido
      nota: "Patio y herramientas. Se entra solo desde el retiro lateral (Lote 105). Bajo el descanso ~1.92 m libres; bajo el tramo de 10 baja hasta ~0.8 m junto al eje B."
    # Entre columnas A3-A4-B3-B4, mitad y mitad. Orden propuesto: lavado junto a la escalera, baño
    # junto al eje 4 (más cerca del baño del primer piso de la referencia -> bajantes más cortas).
    - {id: lavado, nombre: Lavado, tipo: servicio, rect: [7.05, 0.00, 9.125, 2.68], estado: definido}
    - {id: bano_pb, nombre: Baño completo, tipo: bano, rect: [9.125, 0.00, 11.20, 2.68], estado: definido, nota: "inodoro, lavamanos y ducha (sin tina)"}
  p1: []
  altillo: []

# Muros que no son de ladrillo. `de` / `a` = extremos del eje del muro.
muros:
  pb:
    - {id: celosia_ingreso, tipo: celosia_madera, de: [0.00, 4.95], a: [2.58, 4.95], nota: "separa living e ingreso; de piso a techo"}

# Aberturas en los bordes de los ambientes. tipo: puerta | ventana | vano (paso abierto, sin muro)
aberturas:
  pb:
    # Depósito: puerta al costado de la columna A3, donde el techo interior sube (bajo el tramo de 6).
    - {id: puerta_deposito, tipo: puerta, de: [6.87, 0.00], a: [6.07, 0.00], abre_hacia: afuera, alto: 1.85, nota: "desde el retiro, bajo el descanso (~1.92 libres)"}
    # Living → terraza: abertura de 2.43 entre las columnas A1 y B1, como en la referencia.
    - {id: living_terraza, tipo: corrediza, de: [0.00, 0.125], a: [0.00, 2.555], nota: "2.43 m, puerta corrediza/ventanal a la terraza"}
    # Lavado y baño: acceso por el eje B, puertas juntas cerca del muro divisorio (posición propuesta).
    - {id: puerta_lavado, tipo: puerta, de: [8.97, 2.68], a: [8.17, 2.68], abre_hacia: lavado, nota: "0.80"}
    - {id: puerta_bano_pb, tipo: puerta, de: [9.20, 2.68], a: [9.90, 2.68], abre_hacia: bano_pb, nota: "0.70"}
    # Ventanas al retiro lateral (luz y ventilación).
    - {id: ventana_lavado, tipo: ventana, de: [7.61, 0.00], a: [8.61, 0.00], antepecho: 1.10, alto: 2.10, nota: "1.00 × 1.00"}
    - {id: ventana_bano_pb, tipo: ventana, de: [9.84, 0.00], a: [10.44, 0.00], antepecho: 1.60, alto: 2.10, nota: "0.60 × 0.50, alta por privacidad"}
    - {id: puerta_entrada, tipo: puerta, de: [0.00, 5.45], a: [0.00, 6.37], abre_hacia: ingreso, nota: "0.92 m, como en la referencia"}
    - {id: ingreso_estar, tipo: vano, de: [2.58, 4.95], a: [2.58, 6.67], nota: "ingreso abierto hacia el estar"}
    - {id: living_paso, tipo: vano, de: [2.58, 4.95], a: [4.40, 4.95], nota: "paso del living al estar, después de la celosía"}
    - {id: living_estar, tipo: vano, de: [4.40, 3.98], a: [4.40, 4.95], nota: "bajo la escalera, abierto"}

# ─────────────────────────────────────────────────────────────────────────────
# REFERENCIA: juego impreso fotografiado (IMG_8276, IMG_8277). Solo para consulta;
# se dibuja en gris debajo del diseño nuevo.
# ─────────────────────────────────────────────────────────────────────────────
