    - {id: pasillo_pb, nombre: Pasillo, tipo: circulacion, rect: [11.20, 2.63, 16.90, 4.17], estado: aproximado}
    - {id: despensa, nombre: Despensa, tipo: servicio, rect: [11.20, 4.17, 13.00, 6.67], estado: aproximado}
    - {id: deposito, nombre: Depósito, tipo: servicio, rect: [13.10, 4.17, 14.95, 6.67], estado: aproximado}
    - {id: lavanderia, nombre: Lavandería, tipo: servicio, rect: [15.05, 4.17, 16.90, 6.67], estado: aproximado}

  p1:
    - {id: balcon, nombre: Balcón, tipo: exterior, rect: [-1.45, 0.00, -0.125, 4.00], estado: aproximado}
    - {id: dorm_ppal, nombre: Dormitorio principal, tipo: dormitorio, rect: [0.00, 0.00, 4.40, 4.15], estado: aproximado}
    - {id: bano_ppal_wc, nombre: Baño ppal. WC, tipo: bano, rect: [0.00, 4.30, 2.00, 6.67], estado: aproximado}
    - {id: bano_ppal, nombre: Baño ppal., tipo: bano, rect: [2.00, 4.20, 4.00, 6.67], estado: aproximado}
    - {id: closet, nombre: Closet, tipo: servicio, rect: [4.00, 4.20, 6.50, 6.67], estado: aproximado}
    - {id: estudio, nombre: Estudio, tipo: social, rect: [7.05, 0.00, 11.20, 2.63], estado: aproximado}
    - id: living_p1
      nombre: Living
      tipo: social
      poly: [[7.05, 2.80], [10.00, 2.80], [10.00, 6.67], [6.50, 6.67], [6.50, 3.98], [7.05, 3.98]]
      estado: aproximado
    - id: pasillo_p1
      nombre: Pasillo
      tipo: circulacion
      poly: [[10.00, 2.70], [11.20, 2.70], [11.20, 2.30], [13.20, 2.30], [13.20, 3.50], [12.25, 3.50], [12.25, 4.60], [10.00, 4.60]]
      estado: aproximado
    - {id: bano_p1, nombre: Baño, tipo: bano, rect: [10.00, 4.70, 12.25, 6.67], estado: aproximado}
    - {id: bano_p1b, nombre: Baño, tipo: bano, rect: [11.30, 0.00, 13.10, 2.23], estado: aproximado}
    - {id: dorm_2, nombre: Dormitorio 2, tipo: dormitorio, rect: [13.20, 0.00, 16.90, 3.37], estado: aproximado}
    - {id: dorm_3, nombre: Dormitorio 3, tipo: dormitorio, rect: [12.35, 3.58, 16.90, 6.67], estado: aproximado}

  altillo: []   # pendiente: falta foto de la planta altillo de la versión impresa

# Áreas declaradas en la carátula del PDF (versión anterior) — solo referencia.
areas_declaradas_pdf: {pb: 65.66, p1: 79.27, altillo: 53.49, total: 198.42}

verificar_en_obra:
  - "Comprobar que lo construido siguió IMG_8278: tramo del fondo 5.70 m (el PDF decía 4.50 m)."
  - "Sección real de columnas (se asume 25x25) y espesor de losas."
  - "Distancia de la casa al lindero del fondo (5.00 m) y al lateral del Lote 105 (2.01 m)."
