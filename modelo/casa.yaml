      # si se quiere, timbre inalámbrico en el marco de la puerta. 2026-10-07: la bajante se fue al cajón gris de la esquina
      # del volado; el tramo de muro entre la puerta y C1 quedó libre (si se quiere timbre cableado, lo ubica el interiorista).
      # Seguridad (el usuario quiere todo, 2026-10-05). ESQUEMA PROPUESTO: ubicaciones a definir con el instalador;
      # dejar tubos vacíos antes de revocar. Circuitos C22 (portón) y C23 (alarma, cámaras, portero; con respaldo).
      # Ronda de huecos (2026-10-05): puesta a tierra y tubo propio de corrientes débiles (datos, cámaras, portero).
      puesta_tierra: {pos: [-2.40, 6.35], estado: propuesto, nota: "jabalina de cobre (o malla) con cámara de inspección en el jardín junto al acceso, cable al TD; el electricista mide la resistencia (NB 777). Protector contra sobretensiones en el TD"}
      debiles:
        - {linea: [[8.925, 1.30], [8.925, 3.25], [4.55, 3.25], [4.55, 2.95]], etiqueta: "datos ↑ P1 y altillo: tubo PROPIO (no con 220 V) en los tubos dejados junto a B2", estado: propuesto}
        - {linea: [[9.30, 1.30], [9.30, 0.05]], etiqueta: "router + grabador de cámaras (NVR) en el estudio; las cámaras llegan acá", estado: propuesto}
