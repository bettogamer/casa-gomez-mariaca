      nota: "PORTÓN CORREDIZO DE UNA HOJA de 3.20 libres (OM 4100/10 art. 51: 3.20 para un sentido) con motor (C22). La hoja (~3.45) se guarda al SUR, detrás del muro de y 1.265 a 4.715; cierra contra el pilar norte. Entra con la puerta peatonal y los medidores porque el lote tiene 9.02 de frente. Chapa CIEGA y LISA por las dos caras (gatos), alto igual al muro (~2.50), cepillos abajo y en los bordes (sin rendijas > 5 cm). Motor por dentro junto al borde sur del hueco (x ≈ -14.90, y ≈ 1.35–1.75), con cierre automático temporizado, fotocélulas, banda de seguridad, desbloqueo manual y batería de respaldo; control remoto. Riel sobre viga de hormigón a nivel, sin escalón. Descartados: telescópico (no hace falta con 3.20), batiente (barrería el estacionamiento), seccional/basculante (piden pórtico)"
