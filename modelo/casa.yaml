    - {id: estar_alt, nombre: Estar-comedor-cocina, tipo: social, rect: [7.05, 0.00, 11.20, 4.67], etiqueta: [9.10, 2.60], estado: definido, nota: "~4.0 × 4.5 libres; cocina en L pegada al baño (pared húmeda compartida); estar con TV en el muro de la escalera; comedor para 4; corrediza a la franja sur"}
    - {id: bano_alt, nombre: Baño, tipo: bano, rect: [11.20, 0.00, 13.00, 2.40], etiqueta: [11.85, 1.95], estado: definido, nota: "~1.65 × 2.25 libres; ventana al norte; bajante por fuera del muro norte en x≈11.40 (entre ventanas de abajo)"}
    - {id: hall_alt, nombre: Hall, tipo: circulacion, rect: [11.20, 2.40, 13.00, 4.67], etiqueta: [12.10, 3.20], estado: definido, nota: "reparte al baño y al dormitorio"}
    - {id: dorm_alt, nombre: Dormitorio, tipo: dormitorio, rect: [13.00, 0.00, 16.90, 4.67], etiqueta: [14.20, 1.20], estado: definido, nota: "dormitorio y cuarto chico unidos (idea del usuario): ~3.70 × 4.45 libres (~16.5 m²); cama queen + zona flexible (cuna, cama de 1 plaza o escritorio); ventanas al norte y al patio"}
    - {id: terraza_alt, nombre: Terraza, tipo: exterior, rect: [-1.125, 0.00, 4.40, 6.67], etiqueta: [1.60, 3.30], estado: definido, nota: "sobre la suite principal y el volado; antepecho perimetral"}
    - {id: franja_sur_alt, nombre: Franja libre 2 m, tipo: exterior, rect: [4.40, 4.67, 16.90, 6.67], etiqueta: [10.60, 5.70], estado: definido, nota: "retiro sur exigido (normativa); patio de servicio descubierto: lavandería con alero, tendedero"}

# Muros que no son de ladrillo. `de` / `a` = extremos del eje del muro.
muros:
  pb:
    - {id: celosia_ingreso, tipo: celosia_madera, de: [0.00, 4.95], a: [2.58, 4.95], nota: "separa living e ingreso; de piso a techo"}
  p1:
    - {id: baranda_logia, tipo: baranda, alto: 1.00, de: [-1.125, 0.00], a: [-1.125, 4.20], nota: "baranda o antepecho ≥ 1.00 m al frente de la logia"}
    - {id: baranda_logia_norte, tipo: baranda, alto: 1.00, de: [-1.125, 0.00], a: [0.00, 0.00], estado: propuesto, nota: "costado norte de la logia: MURO BAJO de ladrillo de 6 huecos de 1.00 (decisión del usuario 2026-10-05)"}
    - {id: celosia_logia_norte, tipo: celosia_madera, de: [-1.125, 0.00], a: [0.00, 0.00], estado: propuesto, nota: "celosía de madera fija sobre el muro bajo, de 1.00 hasta la losa, igual a la del ingreso de PB: privacidad hacia el Lote 105 sin vista directa, deja pasar luz y aire; liviana (punta del volado). Madera para exterior con protector"}

  altillo:
    # Antepechos de la terraza y de la franja (≥ 1.10 m, de ladrillo: siguen la línea del antepecho del techo)
    - {id: antepecho_frente_alt, tipo: baranda, alto: 1.10, de: [-1.125, 0.00], a: [-1.125, 6.67], nota: "antepecho del frente (terraza), ≥ 1.10 m"}
    - {id: antepecho_norte_alt, tipo: baranda, alto: 1.10, de: [-1.125, 0.00], a: [4.40, 0.00], nota: "antepecho norte de la terraza"}
    - {id: antepecho_sur_alt, tipo: baranda, alto: 1.80, de: [-1.125, 6.67], a: [16.90, 6.67], nota: "MURO CIEGO hacia el vecino (Lote 103), ~1.80 m sobre el piso de la terraza y la franja: sin vista directa (OM 4100/10 art. 44); ladrillo de 6 huecos sobre el muro medianero"}
    - {id: antepecho_fondo_alt, tipo: baranda, alto: 1.80, de: [16.90, 4.67], a: [16.90, 6.67], nota: "antepecho del fondo de la franja"}
    # Llegada real (foto del usuario 2026-10-05): hay losa entre B2 y la escalera, al sur del eje B. Muro sobre el eje B
    # de B2 hasta el tramo de 10 (idea del usuario) y baranda al costado del tramo de 10.
    - {id: muro_llegada_b, tipo: ladrillo, de: [4.40, 2.68], a: [5.725, 2.68], estado: propuesto, nota: "muro de ladrillo de 6 huecos sobre el eje B, de B2 hasta la escalera, sobre el borde del hueco: CONSULTAR INGENIERO si hay viga B ahí (lo más probable) y si aguanta el tabique"}
    - {id: baranda_hueco_alt, tipo: baranda, alto: 1.10, de: [5.725, 2.68], a: [5.725, 3.85], estado: propuesto, nota: "baranda al costado del tramo de 10 que llega, 1.10 m, barrotes verticales ≤ 10 cm (bebé); puerta de seguridad removible en el último escalón (y≈3.85)"}

# Lo que queda por encima del plano de corte (se dibuja punteado): aleros, tanque sobre el techo.
proyecciones:
  p1:
    # 2026-10-05 (PROPUESTO): borde norte del domo 0.10 al sur (antes y 5.30) para dejar 0.65 de paso entre el muro del
    # departamento (cara y 4.745) y el domo. El borde sur NO se mueve (y 6.20): correr todo 0.10 dejaba solo ~0.35
    # libres hacia el antepecho sur y la ranura a 0.47 del eje C (el revisor pidió ≥0.40 y ≥0.5).
    - {rect: [9.75, 5.40, 10.90, 6.20], nombre: "tragaluz", estado: propuesto, nota: "PROPUESTO: tragaluz cenital del Baño 2, dos ranuras de ~0.30 × 0.60 (y 5.50–6.10; antes 0.70 desde y 5.40) en la losa del altillo, centradas entre viguetas a cada lado de la de x≈10.31 (las viguetas no se cortan), a 0.57 del eje C; bajo un domo (x 9.75–10.90, y 5.40–6.20) en la franja descubierta: 0.65 de paso al norte y ~0.45 libres al antepecho sur"}
  altillo:
    - {rect: [6.30, 0.00, 7.90, 1.60], nombre: "tanque elevado (sobre el techo)", nota: "base propia de hormigón sobre la columna A3 y el muro de la escalera; forrado de ladrillo: se ve como un volumen cuadrado; bajada al núcleo técnico (x 9.10)"}

# ─────────────────────────────────────────────────────────────────────────────
# PLANTA DE TECHOS (2026-10-04; ESQUEMA para conversar con el ingeniero y el techador). Todo de calamina.
# - Departamento: techo OCULTO detrás de un antepecho en los cuatro lados (caja recta), a un agua al sur.
# - Terraza: techo aparte de calamina sobre estructura de fierro a la vista (postes y vigas), más bajo que el
#   antepecho del departamento, con caída hacia el FRENTE y canaleta vista en el borde (pedido del usuario).
# - Nada vuela sobre la franja de 2 m del sur (OM 4100/10: separación lateral SIN VOLADO en el 2do piso). Sobre la
#   lavandería, semisombra liviana y desmontable.
# Cotas aproximadas: las define el ingeniero.
# ─────────────────────────────────────────────────────────────────────────────
techos:
  material: "calamina galvanizada prepintada (ondulada o trapezoidal); en el departamento con aislación (lana de vidrio + cielo raso)"
  aguas:
    - id: techo_depto
      nombre: Departamento
      poly: [[4.40, 0.00], [16.90, 0.00], [16.90, 4.67], [4.40, 4.67]]
      cae_hacia: sur
      pendiente: 0.15
      cota_alta: 10.05
      cota_baja: 9.35
      estado: definido
      nota: "oculto detrás del antepecho en los cuatro lados; canaleta interior junto al antepecho sur, toda hacia el este (BP2), con rebosaderos (gárgolas) a la franja cada ~4 m por si se tapa"
    - id: techo_terraza
      nombre: Terraza
      poly: [[-1.125, 0.00], [4.40, 0.00], [4.40, 4.67], [-1.125, 4.67]]
      cae_hacia: oeste
      pendiente: 0.15
      cota_alta: 9.90
      cota_baja: 9.07
      estado: definido
      nota: "calamina sobre estructura de fierro a la vista (pedido del usuario), cae hacia el FRENTE: de la calle se ve un borde horizontal con su canaleta. Alto contra el muro del departamento (+9.90, debajo del antepecho +10.20, con babeta), ~2.45 libres en el borde del frente. Apoyos: postes metálicos sobre A1 y B1 y vigas hacia el muro del departamento (x=4.40); la esquina sur (y=4.67) en voladizo desde B1 o con un poste extra. Babeta contra el muro del departamento. Lo define el ingeniero"
  antepechos:
  # cota_base / cota_tope: de dónde a dónde sube cada antepecho (el muro del altillo llega a +9.60).
    - {de: [4.40, 0.00], a: [16.90, 0.00], cota_base: 9.60, cota_tope: 10.20, nota: "antepecho norte del departamento: tapa el borde alto"}
    - {de: [16.90, 0.00], a: [16.90, 4.67], cota_base: 9.60, cota_tope: 10.20, nota: "antepecho del fondo"}
    - {de: [4.40, 4.67], a: [16.90, 4.67], cota_base: 9.60, cota_tope: 10.20, nota: "antepecho sur del departamento: la canaleta va por dentro (nada sale a la franja de 2 m)"}
    - {de: [4.40, 0.00], a: [4.40, 4.67], cota_base: 9.60, cota_tope: 10.20, nota: "antepecho oeste del departamento: el techo de la terraza se apoya debajo"}
    - {de: [-1.125, 6.67], a: [16.90, 6.67], cota_base: 6.60, cota_tope: 8.40, nota: "muro ciego sur hacia el vecino, ~1.80 sobre la losa (ver muros.altillo)"}
  # Tanque elevado: base propia de hormigón sobre la columna A3 y el muro de la escalera, forrado de ladrillo.
  # Capacidad y altura SUPUESTAS (tanque de ~2500 L, ~1.55 de diámetro × 1.55 de alto): las define el plomero/ingeniero.
  # Base subida a +10.50 (usuario 2026-10-05): ~2.5 m sobre la entrada de agua del calefón del altillo (~+8.00).
  tanque: {rect: [6.30, 0.00, 7.90, 1.60], cota_base: 10.50, alto: 1.80, capacidad: "~2500 L (supuesto)", estado: aproximado}
  postes:
    - {pos: [0.00, 0.00], nota: "sobre la columna A1"}
    - {pos: [0.00, 2.68], nota: "sobre la columna B1"}
  # Canaletas por dentro de la línea y=4.67 (no invaden la separación de 2 m), de chapa galvanizada, 0.5%.
  canaletas:
    - {de: [4.55, 4.58], a: [16.78, 4.58], pendiente: 0.005}
    - {de: [-1.18, 0.10], a: [-1.18, 4.58], pendiente: 0.005, nota: "canaleta vista al frente, colgada del borde del techo de la terraza (queda a ~1.05 de la fachada: dentro del voladizo frontal de 1.20)"}
  # Semisombra (malla raschel o toldo) sobre la lavandería: liviana y desmontable, a la altura del antepecho sur.
  semisombras:
    - {rect: [9.40, 4.67, 13.50, 6.67], nombre: "semisombra lavandería", nota: "malla semisombra o toldo retráctil sobre perfiles livianos, entre el muro del departamento y el muro ciego sur; desmontable (no es techo ni volado: confirmar con el arquitecto). El tendedero queda al sol"}
  # La terraza y la franja forman una franja continua de losa descubierta (y 4.67–6.67): punto alto al medio,
  # caída 1.5% hacia las dos esquinas sur, donde están los sumideros y las bajantes pluviales.
  pendientes_losa:
    - {de: [7.90, 6.05], a: [0.20, 6.05], texto: "losa 1.5%"}
    - {de: [7.90, 6.05], a: [15.60, 6.05], texto: "losa 1.5%"}
    - {de: [-0.55, 2.80], a: [-0.55, 4.40], texto: "piso 1%"}
  sumideros:
    - {pos: [-0.75, 6.40]}
    - {pos: [16.55, 6.40]}
  # Cada canaleta baja por un tubo pegado al antepecho hasta la bajante de la esquina (no se vuelca sobre la losa).
  conexiones:
    - [[-1.18, 4.58], [-1.18, 6.55], [-1.00, 6.55]]
    - [[16.78, 4.58], [16.78, 6.55]]
  bajantes:
    - {id: BP1, pos: [-1.00, 6.55], nota: "esquina sur del frente: canaleta del frente (techo de la terraza) + sumidero de la terraza; baja por la esquina del volado al acceso → a la calle (no al desagüe sanitario)"}
    - {id: BP2, pos: [16.78, 6.55], nota: "esquina sur del fondo (C5): techo del departamento + sumidero de la franja; baja al patio → jardín o calle (no al desagüe sanitario)"}

# Fachada (2026-10-05): opciones de materiales para conversar con el usuario. Referencias en
# fuentes/referencias-fachada/. `paleta` = color por tipo de pieza; `acentos` = paños de material sobre una cara:
# vista, u (horizontal de esa vista: oeste = y), z (alto), d (profundidad de la cara: oeste = x de la cara exterior).
fachada:
  elegida: c     # el usuario eligió la opción C (2026-10-05)
  opciones:
    - id: a
      nombre: Blanco y negro
      descripcion: "Como la primera referencia: casa blanca con piezas negras. Carpintería, barandas, puerta y techo de la terraza en negro; el frente del baño de la suite como un volumen negro y un paño negro alrededor de la puerta de entrada. Sobria y contrastada; el negro al oeste se calienta con el sol de la tarde."
      paleta: {muro: "#f5f5f3", losa: "#f5f5f3", zocalo: "#2b2b2b", baranda: "#1e1e1e", marco: "#1e1e1e", puerta: "#1f1f1f", techo: "#1e1e1e", celosia: "#2b2b2b", antepecho: "#f5f5f3", tanque: "#f5f5f3", columna: "#f5f5f3"}
      acentos:
        - {vista: oeste, u: [4.20, 6.795], z: [3.40, 6.40], d: -1.20, material: negro, nota: "frente del baño de la suite"}
        - {vista: oeste, u: [4.95, 6.795], z: [0.20, 3.20], d: -0.125, material: negro, nota: "paño de la entrada"}
    - id: b
      nombre: Beige, marco gris y madera
      descripcion: "Como la segunda referencia: muros beige, bordes de losa en gris oscuro que enmarcan la logia como una caja, listones de madera en la pared del dormitorio dentro de la logia (protegida por el volado), puerta pivotante y celosía de madera, barandas livianas. Cálida y moderna."
      paleta: {muro: "#ddd0bb", losa: "#43464a", zocalo: "#8f8a82", baranda: "#5a5a5a", marco: "#2b2b2b", puerta: "#a8703f", techo: "#43464a", celosia: "#a8703f", antepecho: "#ddd0bb", tanque: "#ddd0bb", columna: "#ddd0bb"}
      acentos:
        - {vista: oeste, u: [4.20, 6.795], z: [3.20, 6.60], d: -1.20, material: gris_oscuro, nota: "costado del marco de la logia: frente del baño de la suite"}
        - {vista: oeste, u: [-0.125, 3.25], z: [3.40, 6.40], d: -0.125, material: madera, nota: "listones de madera en la pared del dormitorio, dentro de la logia"}
        - {vista: oeste, u: [4.95, 6.795], z: [0.20, 3.20], d: -0.125, material: gris_claro, nota: "paño de la entrada"}
    - id: c
      nombre: Blanco, piedra, madera y gris (recomendada)
      descripcion: "Mezcla de las dos: base blanca; el muro ciego del living (el que da a la calle) en piedra, que aguanta el sol de la tarde sin mantenimiento; madera solo donde está protegida (pared del dormitorio dentro de la logia, puerta y celosía); bordes de losa y frente del baño en gris oscuro como marco; carpintería, barandas y techo de la terraza en negro."
      paleta: {muro: "#f3f1ec", losa: "#43464a", zocalo: "#43464a", baranda: "#2b2b2b", marco: "#2b2b2b", puerta: "#a8703f", techo: "#2b2b2b", celosia: "#a8703f", antepecho: "#f3f1ec", tanque: "#f3f1ec", columna: "#f3f1ec"}
      acentos:
        - {vista: oeste, u: [-0.125, 4.95], z: [0.20, 3.20], d: -0.125, material: piedra, nota: "muro ciego del living hacia la calle"}
        - {vista: oeste, u: [4.20, 6.795], z: [3.20, 6.60], d: -1.20, material: gris_oscuro, nota: "frente del baño de la suite (marco de la logia)"}
        - {vista: oeste, u: [-0.125, 3.25], z: [3.40, 6.40], d: -0.125, material: madera, nota: "listones en la pared del dormitorio, dentro de la logia"}

# Aberturas en los bordes de los ambientes. tipo: puerta | ventana | vano (paso abierto, sin muro)
aberturas:
  pb:
    # Definidas (ingreso y living)
    # Entrada (2026-10-05, referencia del usuario): puerta PIVOTANTE de madera con listones verticales y paño fijo de
    # vidrio al costado, los dos en UN SOLO MARCO de madera y del mismo alto (casi hasta el techo). El borde sur
    # queda en 6.37: hace falta muro hasta la columna C1 (bajante de la suite por fuera).
    - {id: puerta_entrada, tipo: puerta, de: [0.00, 5.32], a: [0.00, 6.37], abre_hacia: ingreso, alto: 2.60, estado: propuesto, nota: "1.05 PIVOTANTE (gira sobre un eje en el piso y el marco, no sobre bisagras), maciza, madera con listones verticales y tirador grande; alto ~2.60 hasta la viga del eje 1 (medir cuánto cuelga); barniz exterior: da al oeste (sol de la tarde), el volado de 1 m la protege; burletes contra polvo y viento"}
    - {id: vidrio_entrada, tipo: ventana, de: [0.00, 5.05], a: [0.00, 5.32], antepecho: 0.00, alto: 2.60, estado: propuesto, nota: "paño fijo de vidrio 0.27 de piso a techo, en el mismo marco que la puerta (luz al hall); vidrio LAMINADO de seguridad"}
    - {id: ingreso_estar, tipo: vano, de: [2.58, 4.95], a: [2.58, 6.67], nota: "ingreso abierto hacia el estar"}
    - {id: living_paso, tipo: vano, de: [2.58, 4.95], a: [4.40, 4.95], nota: "paso del living al estar, después de la celosía"}
    - {id: living_estar, tipo: vano, de: [4.40, 3.98], a: [4.40, 4.95], nota: "bajo la escalera, abierto"}
    # Depósito: puerta al costado de la columna A3, donde el techo interior sube (bajo el tramo de 6).
    - {id: puerta_deposito, tipo: puerta, de: [6.87, 0.00], a: [6.07, 0.00], abre_hacia: afuera, alto: 1.85, nota: "desde el retiro, bajo el descanso (~1.92 libres)"}
    # Living (2026-10-05, PROPUESTO): se quita la corrediza a la terraza (2.43 entre A1 y B1; decisión del usuario: a la
    # terraza se sale por la entrada). El muro oeste queda CIEGO: ahí va la TV, centrada en la columna B1, sobre un
    # mueble (y 1.90–3.50). Sin ventana al oeste: el sol de la tarde entra bajo el volado (no lo frena a menos de ~42° de
    # altura) y quedaría a ~25–35° de la pantalla, de frente a quien mira la TV. La luz se compensa con la ventana norte
    # (sol bueno, sin sol de frente a los ojos ni reflejo en la pantalla), que crece de 1.20 × 1.20 a 3.00 × 1.20.
    - {id: ventana_living, tipo: ventana, de: [0.70, 0.00], a: [3.70, 0.00], antepecho: 0.90, alto: 2.10, estado: propuesto, nota: "3.00 × 1.20 al norte (retiro), centrada en el muro (0.575 de ladrillo a cada columna, A1 y A2). Única ventana del living: 3.60 m² de vidrio (~1/6 del piso). Sugerido (revisores 2026-10-05): 2 paños fijos de ~0.75 a los costados (vidrio esmerilado hasta ~1.50 por privacidad hacia el retiro) y 2 hojas centrales de ~0.75 batientes hacia adentro, con mosquitero (≥1.50 abribles); que no abran hacia el retiro. Roller screen para las horas de TV. Dintel de H°A° (3.00 de luz, apoyo 20–25 cm por lado) bajo la viga del eje A, lo define el ingeniero. NO estirar hasta las columnas (columna corta). Servidumbre de vista: queda a ~2.01 del lindero, medir en obra. Proporción de luz/ventilación de sala según OM 1061/91: confirmar con el arquitecto"}
    # ── Planta baja v4, aprobada 2026-10-03 ──
    - {id: hall_grada, tipo: vano, de: [4.40, 4.125], a: [5.725, 4.125], nota: "arranque de la grada"}
    - {id: hall_grada_lado, tipo: vano, de: [5.725, 4.125], a: [5.725, 2.68], nota: "costado del tramo de 10 (baranda)"}
    - {id: hall_pasillo, tipo: vano, de: [7.05, 2.68], a: [7.05, 3.73], nota: "hall abierto al pasillo"}
    - {id: puerta_bano_pb, tipo: puerta, de: [8.70, 2.68], a: [8.00, 2.68], abre_hacia: bano_pb, estado: definido, nota: "0.70 batiente (el usuario no quiere corrediza, 2026-10-05); corrida al este para no chocar con el lavamanos; abre hacia el baño (el pasillo de 0.90 queda libre), bisagra del lado este: la hoja abierta queda contra el muro, delante del inodoro"}
    - {id: ventana_bano_pb, tipo: ventana, de: [7.60, 0.00], a: [8.30, 0.00], antepecho: 1.60, alto: 2.10, nota: "0.70 × 0.50 alta, al retiro; sobre la ducha: marco de aluminio o PVC y alféizar con pendiente hacia afuera"}
    - {id: puerta_estudio, tipo: puerta, de: [9.85, 2.68], a: [9.05, 2.68], abre_hacia: estudio, nota: "0.80"}
    - {id: ventana_estudio, tipo: ventana, de: [9.30, 0.00], a: [11.00, 0.00], antepecho: 0.90, alto: 2.10, nota: "1.70 × 1.20 al retiro (sin tocar la columna A4)"}
